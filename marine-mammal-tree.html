<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d140f">
<script>
try {
  const savedTheme = localStorage.getItem('chiroptera-theme');
  const theme = savedTheme === 'light' || savedTheme === 'dark'
    ? savedTheme
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f3f0e5' : '#0d140f';
} catch (_) {
  document.documentElement.dataset.theme = 'dark';
}
</script>
<title>Marine mammals — tree and range map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --abyss:#0d140f;
  --prussian:#1a2f1c;
  --prussian-2:#22422a;
  --line:#a9c98c;
  --line-dim:#5b7a49;
  --bone:#f4f1e6;
  --text:#dfe4d6;
  --muted:#b7bfa9;
  --ochre:#e8ab4c;
  --ochre-dim:#8a6427;

  --display:"Fraunces",Georgia,serif;
  --body:"Lexend","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;

  --pad:clamp(18px,4vw,56px);
}
:root[data-theme="light"]{
  color-scheme:light;
  --abyss:#f3f0e5;
  --prussian:#e4eadc;
  --prussian-2:#d4dfca;
  --line:#315f3a;
  --line-dim:#7d9272;
  --bone:#17251a;
  --text:#26352a;
  --muted:#5d6d5d;
  --ochre:#9b5c13;
  --ochre-dim:#b98a4d;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
.fbtn,.gen,.switch button,.tree-tools button,.jump,#fclear,.lu-close,g.tip,g.trow,button.gen{
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(232,171,76,.25);
}
body{
  margin:0;
  background:var(--abyss);
  color:var(--text);
  font-family:var(--body);
  font-weight:400;
  font-size:16.5px;
  line-height:1.62;
  overflow-x:hidden;
}

/* paper grain */
body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;z-index:99;
  opacity:.09;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23g)'/></svg>");
}
body::after{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:98;
  background:radial-gradient(120% 90% at 50% 8%, rgba(45,80,48,.16), rgba(13,20,15,0) 62%);
}

.wrap{max-width:1640px;margin:0 auto;padding:0 var(--pad)}

/* ---------- tree and map workspace ---------- */
.top-grid{display:grid;grid-template-columns:1fr}
#tree-section,#country-map{
  padding-top:clamp(18px,2.6vw,28px);
  border-top:none;
}
#country-map{padding-bottom:0}
@media (min-width:1300px){
  .top-grid{
    grid-template-columns:minmax(0,5fr) minmax(0,7fr);
    column-gap:56px;
  }
  #tree-section{grid-column:1;min-width:0}
  #country-map{grid-column:2;min-width:0}
}

section{padding:clamp(40px,5.5vw,72px) 0;border-top:1px solid rgba(150,190,120,.2);scroll-margin-top:70px}

/* ---------- tree ---------- */
.treebox{
  position:relative;
  margin-top:0;
  border:1px solid rgba(150,190,120,.22);
  background:#16281a;
  border-radius:3px;
  overflow-x:auto;
  overflow-y:visible;
  -webkit-overflow-scrolling:touch;
}
svg#tree{display:block;width:100%;height:auto}
.branch{stroke:var(--line-dim);stroke-width:1.2;fill:none;stroke-linecap:square}
.tip-hit{fill:transparent;cursor:pointer}
.tip-name{font-family:var(--display);font-size:19px;font-weight:500;fill:var(--bone);cursor:pointer;dominant-baseline:middle}
.tip-common{font-family:var(--body);font-size:15px;fill:#adb9a0;dominant-baseline:middle}
.tip-count{font-family:var(--mono);font-size:14.5px;fill:var(--muted);text-anchor:end;dominant-baseline:middle}
.sub-label{font-family:var(--mono);font-size:16.5px;letter-spacing:.26em;text-transform:uppercase;fill:var(--ochre)}
.sf-label{font-family:var(--mono);font-size:13.5px;letter-spacing:.2em;text-transform:uppercase;fill:var(--line)}
.sf-count{font-family:var(--mono);font-size:13.5px;letter-spacing:.06em;fill:#8f9c85}
.knock{fill:#16281a}
g.tip:hover .tip-name,g.tip:focus-visible .tip-name{fill:var(--ochre)}
g.tip:hover .branch-tip,g.tip.active .branch-tip{stroke:var(--ochre);stroke-width:2}
g.tip.active .tip-name{fill:var(--ochre)}
g.tip:focus-visible{outline:none}
.focus-ring{fill:none;stroke:none}
g.tip:focus-visible .focus-ring{stroke:var(--ochre);stroke-width:1;stroke-dasharray:3 3}

/* ---------- detail card (dense) ---------- */
.card.empty{display:none}
.card .lu-d-sci{font-size:19px;padding-right:0}
.card .lu-d-common{font-size:12.5px;margin:3px 0 0}
.card .lu-d-authority{font-size:10px;margin-top:2px}
.card .lu-links{margin-top:10px;gap:6px 10px}
.card .lu-links a{width:28px;height:28px}
.card .lu-facts{gap:12px;margin-top:12px;padding-top:0}
.card .lu-section{padding:11px 14px}
.card .lu-section h4{margin-bottom:7px;font-size:9.5px}
.card .lu-section dl{gap:3px 10px;font-size:12.5px}
.card .lu-section .lu-note{margin-top:8px;font-size:12.5px}
.card .lu-status{padding:1px 7px}
.card .lu-prov{margin-top:12px;font-size:11px;padding-top:10px}
.card .lu-facts,.card .lu-prov{clear:both}
.inat-photo{
  float:right;width:min(34%,220px);min-height:120px;aspect-ratio:4/3;margin:0 0 14px 18px;
  overflow:hidden;border:1px solid rgba(150,190,120,.25);border-radius:2px;
  background:linear-gradient(110deg,var(--prussian) 35%,var(--prussian-2) 50%,var(--prussian) 65%);
  background-size:220% 100%;animation:photo-loading 1.4s linear infinite;
}
.inat-photo:not([aria-busy="true"]){min-height:0;animation:none;background:none;border:none;overflow:visible}
.inat-photo a{display:block;color:var(--muted);text-decoration:none}
.inat-photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:transparent}
.inat-photo figcaption{margin-top:6px;font:9px/1.45 var(--mono);letter-spacing:.03em;color:var(--muted)}
.inat-photo a:hover figcaption{color:var(--ochre)}
@keyframes photo-loading{to{background-position:-220% 0}}
@media (max-width:600px){
  .inat-photo{float:none;width:100%;max-width:280px;margin:0 auto 14px}
}

/* sits below the tree + map grid — the one shared detail card */
.card{
  border:1px solid rgba(150,190,120,.28);border-left:3px solid var(--ochre);
  background:rgba(14,26,19,.75);padding:14px 18px;border-radius:2px;
  margin:0 0 20px;scroll-margin-top:72px;
}

.card-lineage{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;line-height:1.55}
.card .name-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 7px}
.card h3{font-family:var(--display);font-weight:500;font-size:19px;margin:0;line-height:1.05}
.card .common{font-size:12.5px;color:var(--ochre);margin:0}
.card p.desc{margin:0 0 10px;max-width:64ch;color:var(--text);font-size:13px;line-height:1.48}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 9px}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--bone);
  background:rgba(178,210,150,.1);border:1px solid rgba(178,210,150,.22);border-radius:20px;
  padding:4px 11px;
}
.chip b{color:var(--ochre);font-weight:500;font-family:var(--mono)}
.range-line{font-size:12.5px;color:var(--muted);margin:0 0 9px}
.range-line b{color:var(--text);font-weight:400}
.jump{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:none;padding:0;color:var(--ochre);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ochre-dim);
  transition:.18s;
}
.jump:hover{color:var(--bone);background:none}

/* ---------- footer ---------- */
footer{border-top:1px solid rgba(178,210,150,.2);padding:24px 0 32px;color:#b8c2ac;font:10.5px/1.6 var(--mono);letter-spacing:.04em}
footer a{color:var(--line);text-underline-offset:3px}
footer a:hover{color:var(--ochre)}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ---------- sticky topbar with the search field ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(13,20,15,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(150,190,120,.2);
}
.topbar-in{
  max-width:1640px;margin:0 auto;padding:10px var(--pad);
  display:flex;align-items:center;gap:20px;min-height:58px;
}
.tb-brand{font-family:var(--display);font-size:17px;font-weight:500;color:var(--bone);text-decoration:none;white-space:nowrap}
.tb-brand em{font-style:italic;color:var(--line)}
.tb-nav{display:flex;gap:18px}
.tb-nav a{
  display:flex;align-items:center;justify-content:center;width:32px;height:32px;
  color:var(--muted);text-decoration:none;border:0;transition:.15s;
}
.tb-nav a:hover{color:var(--ochre)}
.tb-nav a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.tb-nav svg{width:17px;height:17px;fill:currentColor}

.random-bat{
  display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;
  color:var(--muted);background:transparent;border:0;cursor:pointer;transition:.15s;
}
.random-bat:hover:not(:disabled){color:var(--ochre)}
.random-bat:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.random-bat:disabled{opacity:.38;cursor:wait}
.random-bat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.theme-toggle{
  width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:none;
  background:transparent;border:0;color:var(--muted);padding:6px;cursor:pointer;transition:.15s;
}
.theme-toggle:hover{color:var(--ochre)}
.theme-toggle:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.theme-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.theme-moon{display:none}
:root[data-theme="light"] .theme-sun{display:none}
:root[data-theme="light"] .theme-moon{display:block}

.tb-search{margin-left:auto;position:relative;width:min(330px,58vw)}
.tb-search input{
  width:100%;background:rgba(26,47,28,.85);border:1px solid var(--line-dim);color:var(--text);
  font-family:var(--body);font-size:13.5px;padding:8px 44px 8px 32px;border-radius:999px;
}
.tb-search input::placeholder{color:#899783}
.tb-search input:focus{outline:none;border-color:var(--ochre);background:var(--prussian)}
.tb-ico,.tb-kbd{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--line-dim)}
.tb-ico{left:11px;font-size:12px}
.tb-kbd{right:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;transition:opacity .15s}
.tb-search input:focus + .tb-kbd{opacity:0}

.tb-results{
  position:absolute;top:calc(100% + 9px);right:0;width:min(440px,90vw);
  max-height:min(560px,70vh);overflow-y:auto;overscroll-behavior:contain;
  background:#101d16;border:1px solid var(--line-dim);border-radius:4px;
  box-shadow:0 26px 64px rgba(0,0,0,.55);
}
.tb-results .lu-foot{
  padding:9px 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--line-dim);
  border-top:1px solid rgba(150,190,120,.16);
}
.lu-none{padding:18px 14px;font-size:13px;color:var(--muted);font-style:italic}
.lu-count{
  padding:8px 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--line-dim);border-bottom:1px solid rgba(150,190,120,.16);
}

/* ---------- species drawer ---------- */
.lu-scrim{position:fixed;inset:0;background:rgba(9,14,10,.62);z-index:70;opacity:0;pointer-events:none;transition:opacity .26s}
.lu-scrim.open{opacity:1;pointer-events:auto}
.lu-drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(640px,94vw);z-index:80;
  background:#101d16;border-left:1px solid var(--line-dim);
  transform:translateX(101%);transition:transform .28s cubic-bezier(.2,.7,.2,1);
  overflow-y:auto;overscroll-behavior:contain;padding:clamp(22px,3vw,36px);
}
.lu-drawer.open{transform:none}
.lu-close{
  position:absolute;top:14px;right:16px;z-index:2;
  background:transparent;border:1px solid var(--line-dim);color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 12px;border-radius:2px;cursor:pointer;
}
.lu-close:hover{border-color:var(--ochre);color:var(--ochre)}

/* ---------- lookup rows & detail (shared by dropdown and drawer) ---------- */
.lu-row{padding:9px 14px;border-bottom:1px solid rgba(150,190,120,.10);cursor:pointer}
.lu-row:hover,.lu-row:focus-visible{background:var(--prussian);outline:none}
.lu-row.active{background:var(--prussian-2);border-left:3px solid var(--ochre);padding-left:11px}
.lu-row .lu-sci{font-style:italic;font-family:var(--display);font-size:14.5px;color:var(--bone)}
.lu-row .lu-common{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.lu-row .lu-common.lu-dk{color:var(--ochre)}
.lu-row .lu-fam{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--line-dim);margin-top:2px;text-transform:uppercase}
.lu-empty{color:var(--muted);font-style:italic;padding-top:8vh;text-align:center}
.lu-d-sci{font-family:var(--display);font-style:italic;font-size:clamp(24px,3.4vw,34px);margin:0;color:var(--bone);padding-right:90px}
.lu-d-common{font-size:15px;color:var(--line);margin:5px 0 0}
.lu-d-common.lu-dk{color:var(--ochre)}
.lu-d-common .lu-dk-src{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.lu-d-authority{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.lu-facts{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(300px,1.2fr);gap:20px;margin-top:24px}
@media (max-width:700px){ .lu-facts{grid-template-columns:1fr} }
.lu-section{background:var(--prussian);border:1px solid rgba(150,190,120,.25);border-radius:4px;padding:16px 18px}
.lu-section h4{margin:0 0 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);font-weight:500}
.lu-section dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.lu-section dt{color:var(--muted);white-space:nowrap}
.lu-section dd{margin:0;color:var(--text)}
.lu-section .lu-note{margin:10px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
.lu-section .lu-src{margin:7px 0 0;font-family:var(--mono);font-size:9.5px;color:var(--line-dim)}
.lu-status{display:inline-block;padding:2px 8px;border-radius:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;border:1px solid var(--line-dim)}
.lu-status.lc{color:#8fd19e;border-color:#3a6b45}
.lu-status.nt,.lu-status.vu{color:var(--ochre);border-color:var(--ochre-dim)}
.lu-status.en,.lu-status.cr{color:#e88a8a;border-color:#8a3a3a}
.lu-status.dd,.lu-status.na{color:var(--muted)}
.lu-links{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:22px}
.lu-links a{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--line);text-decoration:none;border:0;border-radius:0;
}
.lu-links a:hover{color:var(--ochre)}
.lu-links a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.lu-links svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lu-links .wiki-mark{font:18px/1 Georgia,serif;transform:translateY(-1px)}
.lu-prov{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.55;border-top:1px solid rgba(150,190,120,.18);padding-top:14px}

.wm-pending{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--line-dim);padding:22px 0;text-align:center;
}

.lu-prov a{color:var(--line)}

/* ---------- country browse map ---------- */
.cm-map-wrap{margin-top:0}
.cm-map{position:relative}
.cm-map svg{display:block;width:100%;height:auto;background:#122015;border:1px solid rgba(150,190,120,.22);border-radius:3px;cursor:grab;touch-action:none}
.cm-map svg.dragging{cursor:grabbing}
.cm-zoom-g{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cm-zoom-g.no-anim{transition:none}
.cm-label{
  position:absolute;top:10px;left:10px;z-index:2;pointer-events:none;max-width:calc(100% - 76px);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ochre);background:rgba(13,20,15,.85);border:1px solid var(--ochre-dim);
  padding:6px 12px;border-radius:2px;opacity:0;transform:translateY(-4px);
  transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cm-label.show{opacity:1;transform:none}
.cm-zoom-ctrl{position:absolute;top:10px;right:10px;z-index:2;display:flex;flex-direction:column;gap:4px}
.cm-zoom-ctrl button{
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px;line-height:1;
  background:rgba(13,20,15,.85);border:1px solid var(--line-dim);color:var(--text);
  border-radius:2px;cursor:pointer;transition:.15s;
}
.cm-zoom-ctrl button:hover{border-color:var(--ochre);color:var(--ochre)}
.cm-zoom-ctrl button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.cm-land{fill:#274a2e;stroke:none;pointer-events:none}
.cm-c{fill:#274a2e;stroke:#122015;stroke-width:.4;vector-effect:non-scaling-stroke;transition:fill .12s}
.cm-c.has{fill:#345f3a;cursor:pointer}
.cm-c.has:hover{fill:#4a7a49}
.cm-c.range{fill:var(--ochre-dim)}
.cm-c.range:hover{fill:#a9822f}
.cm-c.sel{fill:var(--ochre)}
.cm-c.range.sel{fill:var(--ochre)}
.cm-d{fill:#5c8759;stroke:#122015;stroke-width:.8;cursor:pointer;transition:fill .12s}
.cm-d:hover{fill:#7fae6e}
.cm-d.range{fill:var(--ochre-dim)}
.cm-d.sel{fill:var(--ochre)}
.cm-d.range.sel{fill:var(--ochre)}
.cm-ring{fill:none;stroke:var(--ochre);stroke-width:1.4;pointer-events:none}
.cm-mode{display:flex;gap:2px;margin:0}
.cm-mode button{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--muted);padding:5px;border-radius:0;cursor:pointer;transition:.15s;
}
.cm-mode button:hover{color:var(--ochre)}
.cm-mode button[aria-pressed="true"]{background:rgba(178,210,150,.1);color:var(--ochre)}
.cm-mode button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.cm-mode svg{width:16px;height:16px;overflow:visible}
.cm-mode .mode-globe{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.cm-mode .mode-country{fill:currentColor;stroke:none}

@media (max-width:620px){
  .topbar-in{flex-wrap:wrap;gap:10px 14px}
  .tb-brand{font-size:15px;flex-basis:100%}
  .tb-search{width:auto;margin-left:0;flex:1 1 180px}
}

/* ---------- expandable tree ---------- */
.tree-tools{position:absolute;z-index:3;top:8px;right:8px;display:flex;gap:2px;align-items:center;margin:0}
.tree-tools button{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--muted);padding:5px;border-radius:0;cursor:pointer;transition:.15s;
}
.tree-tools button:hover{color:var(--ochre)}
.tree-tools button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.tree-tools .cm-mode button[aria-pressed="true"]{background:rgba(178,210,150,.1);color:var(--ochre)}
.tree-tools svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
g.trow{cursor:pointer;transition:opacity .25s}
g.trow.dim{opacity:.22}
g.trow.dim:hover{opacity:.5}
g.trow .trow-hit{fill:transparent}
g.trow:hover .trow-hit{fill:rgba(178,210,150,.07)}
g.trow:focus-visible{outline:none}
g.trow:focus-visible .trow-hit{fill:rgba(232,171,76,.15)}
.t-subfam{font-family:var(--display);font-size:17px;font-weight:500;fill:var(--bone);dominant-baseline:middle}
.t-tribe{font-family:var(--mono);font-size:12.5px;letter-spacing:.18em;fill:var(--ochre);dominant-baseline:middle}
.t-genus{font-family:var(--display);font-style:italic;font-size:17px;fill:#eef0e2;dominant-baseline:middle}
.t-species{font-family:var(--display);font-style:italic;font-size:16px;fill:#c3cdb8;dominant-baseline:middle}
.t-note{font-family:var(--body);font-size:14px;fill:#8f9c85;dominant-baseline:middle}
.t-count{font-family:var(--mono);font-size:13px;fill:#8f9c85;text-anchor:end;dominant-baseline:middle}
.sub-branch{stroke:rgba(178,210,150,.34);stroke-width:1}
.t-knot{fill:var(--line-dim)}
.t-knot.shut{fill:var(--ochre-dim)}
.t-knot.open{fill:#16281a;stroke:var(--ochre);stroke-width:1.5}
.t-knot.leaf{fill:#567f52}
g.tip:hover .t-knot.shut,g.trow:hover .t-knot.shut{fill:var(--ochre)}
g.trow:hover .t-genus,g.trow:hover .t-species,g.trow:hover .t-subfam{fill:var(--ochre)}
g.trow.species.active .t-species{fill:var(--ochre)}
g.trow.species.active .trow-hit{fill:rgba(232,171,76,.12)}
g.trow.static{cursor:default}
g.trow.static:hover .trow-hit{fill:none}
g.trow.static:hover .t-genus{fill:#eef0e2}
.fam-open .tip-name{fill:var(--ochre)}

<script>
const themeToggle = document.getElementById('theme-toggle');
const themeMeta = document.querySelector('meta[name="theme-color"]');

function applyTheme(theme, persist = false){
  document.documentElement.dataset.theme = theme;
  themeMeta.content = theme === 'light' ? '#f3f0e5' : '#0d140f';
  const label = `Switch to ${theme === 'light' ? 'dark' : 'light'} mode`;
  themeToggle.setAttribute('aria-label', label);
  themeToggle.title = label;
  themeToggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
  if (persist) {
    try { localStorage.setItem('chiroptera-theme', theme); } catch (_) {}
  }
}

applyTheme(document.documentElement.dataset.theme || 'dark');
themeToggle.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
});

/* =========================================================
   1. FAMILY DATA
   ========================================================= */
const F = {
  Balaenidae:{common:"Right and bowhead whales",genera:2,species:4,range:"Arctic, and temperate waters of both hemispheres",
    desc:"Enormously thick blubber, no throat grooves and no dorsal fin. They feed by skimming — swimming forward, mouth open, straining copepods through baleen up to three metres long. Slow, fat and floating when dead, which is precisely why whalers named them the “right” whales to kill, and why three of the four species are still recovering."},
  Balaenopteridae:{common:"Rorquals, including the blue and grey whales",genera:3,species:11,range:"All oceans",
    desc:"The lunge feeders. Pleated throat grooves let the mouth balloon out around a volume of water larger than the whale itself, which is then forced back out through the baleen. The group holds the largest animal that has ever lived, and — since MDD folded Eschrichtius in — the grey whale, whose bottom-ploughing for amphipods is unlike anything else here."},
  Cetotheriidae:{common:"Pygmy right whale",genera:1,species:1,range:"Cool temperate waters of the Southern Ocean",
    desc:"One living species, and for a long time it sat alone in its own family. Fossil work then matched it to the cetotheres, a group everyone had assumed died out millions of years ago, making Caperea the last of a lineage rather than an offshoot of the right whales it was named for. It is rarely seen alive and much of its biology is simply unknown."},
  Physeteridae:{common:"Sperm whale",genera:1,species:1,range:"All deep oceans",
    desc:"The largest toothed predator alive and the deepest-diving mammal, working the sea floor two kilometres down in total darkness for an hour at a time. The huge nose is an acoustic instrument: it generates the loudest sound produced by any animal, a directional click used to find squid. Females and young live in lasting matrilineal groups with dialects of their own."},
  Kogiidae:{common:"Pygmy and dwarf sperm whales",genera:1,species:2,range:"Deep tropical and temperate waters worldwide",
    desc:"Small relatives of the sperm whale with the same spermaceti apparatus at a fraction of the size. When startled they release a cloud of reddish-brown intestinal fluid and vanish behind it, the only cetaceans known to use a squid's trick. Rarely seen at sea; most of what is known comes from strandings."},
  Platanistidae:{common:"South Asian river dolphins",genera:1,species:2,range:"The Ganges, Brahmaputra and Indus river systems",
    desc:"Effectively blind — the eye has no lens and registers little more than direction of light — and they swim on one side, trailing a flipper along the bottom while scanning with sonar. They are the most distinctive of the river dolphins and among the most threatened, cut into isolated populations by barrages and dams."},
  Lipotidae:{common:"Baiji, Yangtze river dolphin",genera:1,species:1,range:"The Yangtze river, China",
    desc:"A family of one, and almost certainly a family of none. A dedicated survey in 2006 failed to find a single animal and declared it functionally extinct — the first cetacean driven out by humans, not by hunting but by the accumulated weight of dam building, boat traffic, fishing gear and pollution along the world's busiest river."},
  Iniidae:{common:"Amazon river dolphins",genera:1,species:4,range:"The Amazon and Orinoco basins",
    desc:"Pink, loose-necked and nearly blind, navigating turbid floodwater almost entirely by sonar. In the wet season they swim out of the river channels and hunt among the trunks of flooded forest. Fused neck vertebrae have been lost here too, so the head swings freely — useful in a habitat full of obstacles."},
  Pontoporiidae:{common:"Franciscana",genera:1,species:1,range:"Coastal south-western Atlantic, from Brazil to Argentina",
    desc:"A river dolphin that does not live in a river. It is the franciscana's ancestors that were riverine; this one has moved out into shallow coastal water, keeping the long thin beak — the longest relative to body size of any cetacean — and the murky-water sonar. Bycatch in gillnets is the pressing threat."},
  Ziphiidae:{common:"Beaked whales",genera:6,species:24,range:"Deep water in all oceans",
    desc:"The least known large animals on Earth. They are deep-diving squid specialists — a Cuvier's beaked whale holds the mammal record at nearly four hours submerged — and several species have never been seen alive, being known only from skulls washed ashore. Most males carry a single pair of tusks used for fighting each other, and the females are toothless."},
  Monodontidae:{common:"Beluga and narwhal",genera:2,species:2,range:"Arctic and subarctic",
    desc:"Two Arctic specialists with no dorsal fin — an advantage under pack ice — and unfused neck vertebrae, so unlike other whales they can turn their heads. The narwhal's tusk is a single spiralled left canine, grown through the lip, packed with nerve endings and now thought to be as much a sensory organ and social signal as a weapon."},
  Phocoenidae:{common:"Porpoises",genera:3,species:8,range:"Temperate and cold coastal waters, plus Asian rivers",
    desc:"Small, blunt-headed and spade-toothed rather than cone-toothed, and quite separate from the dolphins they are often confused with. They echolocate with narrow-band high-frequency clicks pitched above the hearing of killer whales, which appears to be a way of staying inaudible to their main predator. The family holds the most endangered marine mammal on Earth."},
  Delphinidae:{common:"Oceanic dolphins",genera:19,species:41,range:"All oceans, plus some tropical rivers and estuaries",
    desc:"The largest and most varied cetacean family, and the youngest — most of it radiated within the last ten million years. It runs from the five-foot Hector's dolphin to the killer whale, and includes the most socially complex animals in the sea, with matrilineal groups, learned hunting traditions that differ between neighbouring populations, and signature whistles that work like names."},
  Trichechidae:{common:"Manatees",genera:1,species:3,range:"Caribbean and Atlantic coasts, the Amazon, and West Africa",
    desc:"Slow herbivores of warm shallow water, distinguished from the dugong by a rounded, paddle-shaped tail. Their teeth march forward through the jaw and are replaced from behind throughout life, an adaptation to a diet of abrasive vegetation. All three species are vulnerable to cold, to boat strikes, and to the loss of the warm-water refuges they need in winter."},
  Dugongidae:{common:"Dugong and the Steller's sea cow",genera:2,species:2,range:"Indo-Pacific coasts; the sea cow, the north Pacific",
    desc:"Seagrass grazers of the shallows, with a downturned snout for cropping the plants at the root. The family also holds the largest sirenian ever recorded, Steller's sea cow — a nine-metre north Pacific animal described in 1741 and hunted out within 27 years of its discovery."},
  Otariidae:{common:"Eared seals, sea lions and fur seals",genera:7,species:16,range:"Pacific, Southern Ocean and southern Atlantic coasts",
    desc:"The pinnipeds that still work well on land: visible external ear flaps, hind flippers that rotate forward, and a gait that is close to walking. They swim with the fore flippers, like birds flying underwater, rather than sculling with the rear. Breeding is loud, crowded and strongly polygynous, with the largest bulls holding territory against everything that approaches."},
  Odobenidae:{common:"Walrus",genera:1,species:1,range:"Arctic and subarctic coasts",
    desc:"A family of one, and the only pinniped that feeds mainly on bottom-dwelling molluscs, which it finds in the dark with a dense array of stiff whiskers and takes by suction rather than by biting. Both sexes grow tusks, used for hauling out onto ice and for status. It needs shallow water and sea ice over it, which is a difficult combination to keep."},
  Phocidae:{common:"True or earless seals",genera:14,species:20,range:"Both polar regions, plus temperate and a few tropical coasts",
    desc:"No ear flaps, and hind flippers that cannot turn forward, so on land they hump along on their bellies — the price of being the better divers. They swim by sculling with the hind flippers, pup fast on ice or beach, and include the deepest and longest-diving pinnipeds. The family spans both poles, and the two monk seal genera are the only members left in warm water."},
};

/* =========================================================
   3. CLADOGRAM — expandable to species
   ========================================================= */
const leaf = n => ({name:n, leaf:true});
const clade = (...c) => ({children:c});

const TREE = {name:null, rank:"Marine mammals", children:[
  {name:"Mysticeti", rank:"Parvorder", children:[
    {name:"Balaenoidea", rank:"Superfamily", children:[ leaf("Balaenidae") ]},
    {name:"Balaenopteroidea", rank:"Superfamily", children:[ leaf("Balaenopteridae") ]},
    {name:"Cetotherioidea", rank:"Superfamily", children:[ leaf("Cetotheriidae") ]},
  ]},
  {name:"Odontoceti", rank:"Parvorder", children:[
    {name:"Physeteroidea", rank:"Superfamily", children:[ leaf("Physeteridae"), leaf("Kogiidae") ]},
    {name:"Platanistoidea", rank:"Superfamily", children:[ leaf("Platanistidae") ]},
    {name:"Lipotoidea", rank:"Superfamily", children:[ leaf("Lipotidae") ]},
    {name:"Inioidea", rank:"Superfamily", children:[ leaf("Iniidae"), leaf("Pontoporiidae") ]},
    {name:"Ziphioidea", rank:"Superfamily", children:[ leaf("Ziphiidae") ]},
    {name:"Delphinoidea", rank:"Superfamily", children:[ leaf("Monodontidae"), leaf("Phocoenidae"), leaf("Delphinidae") ]},
  ]},
  {name:"Sirenia", rank:"Order", children:[
    {name:"Trichechoidea", rank:"Superfamily", children:[ leaf("Trichechidae") ]},
    {name:"Dugongoidea", rank:"Superfamily", children:[ leaf("Dugongidae") ]},
  ]},
  {name:"Pinnipedia", rank:"Clade in Carnivora", children:[
    {name:"Otarioidea", rank:"Superfamily", children:[ leaf("Otariidae"), leaf("Odobenidae") ]},
    {name:"Phocoidea", rank:"Superfamily", children:[ leaf("Phocidae") ]},
  ]},
]};

const SVGNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById('tree');
const VW = 700;                            // viewBox width
const TOP = 4, LEFT = 16, TIPX = 110, COUNTX = VW - 24;
const GAP_SF = 46, GAP_SUB = 88;
const RH = {fam:46, subfam:30, tribe:25, genus:25, species:24};
const STEP2 = 14;                          // one nesting step below the family
const PX = l => TIPX + l*STEP2;            // branch point of a level
const LX = l => PX(l) + 9;                 // where its label starts

function el(tag, attrs, txt){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(txt!=null) e.textContent = txt;
  return e;
}

// depth of every backbone node
let maxDepth = 0;
(function setDepth(n,d){
  n.depth = d; if(d>maxDepth) maxDepth = d;
  if(!n.leaf) n.children.forEach(c=>setDepth(c,d+1));
})(TREE,0);

// structural grouping: one entry per superfamily, in drawing order
const BLOCKS = [];
TREE.children.forEach(sub=>{
  sub.children.forEach((sf,i)=>{
    const members = [];
    (function gather(n){ n.leaf ? members.push(n.name) : n.children.forEach(gather); })(sf);
    BLOCKS.push({ sub: i===0 ? sub.name : null, clade: sub.name, sf: sf.name, members });
  });
});

// lineage lookup for the card
const LINEAGE = {};
(function lwalk(node, path){
  if(node.leaf){ LINEAGE[node.name] = path; return; }
  const p = node.name ? path.concat(node.name) : path;
  node.children.forEach(c=>lwalk(c,p));
})(TREE,[]);

/* ---- taxonomy below each family, built on demand ---- */
const kidCache = {};
function famChildren(fam){
  if(kidCache[fam]) return kidCache[fam];
  const out = [];
  (ATLAS[fam]||[]).forEach((sf, si)=>{
    const tribeNodes = [];
    sf.tribes.forEach((tr, ti)=>{
      const genera = tr.g.map(g=>({
        kind:'genus', name:g[0], n:g[1], fam, key:'g:'+g[0]
      }));
      if(tr.t) tribeNodes.push({kind:'tribe', name:tr.t, fam, children:genera, key:'t:'+fam+'|'+si+'|'+ti});
      else tribeNodes.push(...genera);
    });
    if(sf.sub) out.push({kind:'subfam', name:sf.sub, note:sf.note, fam, children:tribeNodes, key:'s:'+fam+'|'+si});
    else out.push(...tribeNodes);
  });
  return (kidCache[fam] = out);
}
function genusChildren(g){
  const e = SP[g];
  if(!e) return null;
  return e[1].map(s=>({kind:'species', name:g+' '+s[0], note:s[1]||'', key:'x:'+g+' '+s[0]}));
}
function nodeChildren(n){
  return n.kind==='genus' ? genusChildren(n.name) : (n.children||null);
}
function countGenera(list){
  return list.reduce((s,n)=> s + (n.kind==='genus' ? 1 : countGenera(n.children||[])), 0);
}
function countSpecies(list){
  return list.reduce((s,n)=> s + (n.kind==='genus' ? n.n : countSpecies(n.children||[])), 0);
}
/* ---- render: a "tree context" bundles everything one cladogram instance
   needs (its own svg, card, open/selection state and data) so the exact
   same drawing/interaction code can drive several independent trees ---- */
function makeTreeCtx(o){
  return Object.assign({
    open: new Set(), famG: {}, selected: null, selectedSp: null,
    onDrawn: null
  }, o);
}

let mainCtx = null; // set once the main tree is built, at the bottom of this script

let countrySpeciesSet = null; // "Genus species" binomials confirmed in the selected country, or null
let countryLive = null;       // {liveFamilies, live, famCount, genusCount} derived from countrySpeciesSet
let countryTreeMode = 'dim';  // 'dim' (gray out the rest) or 'filter' (show only the live branches)

// walk the full taxonomy once per country selection, marking every family/
// subfamily/tribe/genus/species node that has at least one descendant
// (or is itself) confirmed in the selected country, and tallying how many
// live species sit under each family and genus (used by "show only" mode,
// where the on-screen counts must reflect what's actually shown, not the
// species totals for the whole world)
function computeCountryLiveKeys(speciesSet){
  const live = new Set(), liveFamilies = new Set();
  const famCount = {}, genusCount = {};
  function walk(list){
    let total = 0;
    list.forEach(n=>{
      let count;
      if(n.kind === 'genus'){
        const kids = genusChildren(n.name) || [];
        count = 0;
        kids.forEach(sp=>{ if(speciesSet.has(sp.name)){ live.add(sp.key); count++; } });
        if(count) genusCount[n.name] = count;
      } else {
        count = walk(n.children || []);
      }
      if(count) live.add(n.key);
      total += count;
    });
    return total;
  }
  Object.keys(F).forEach(fam=>{
    const count = walk(famChildren(fam));
    if(count){ liveFamilies.add(fam); famCount[fam] = count; }
  });
  return {live, liveFamilies, famCount, genusCount};
}

// live descendant counts, used only in "show only" mode — mirrors
// countGenera/countSpecies but counts just the surviving species
function liveGeneraCount(list){
  return list.reduce((s,n)=> s + (n.kind==='genus' ? (countryLive.genusCount[n.name]?1:0) : liveGeneraCount(n.children||[])), 0);
}
function liveSpeciesCount(list){
  return list.reduce((s,n)=> s + (n.kind==='genus' ? (countryLive.genusCount[n.name]||0) : liveSpeciesCount(n.children||[])), 0);
}

function applyTreeDim(){
  if(!mainCtx) return;
  Object.keys(mainCtx.famG).forEach(n=>{
    const countryOut = !!countryLive && !countryLive.liveFamilies.has(n);
    mainCtx.famG[n].classList.toggle('dim', countryOut);
  });
  mainCtx.svg.querySelectorAll('g.trow[data-key]').forEach(g=>{
    g.classList.toggle('dim', !!countryLive && !countryLive.live.has(g.dataset.key));
  });
}

// node marker sitting on the branch point
function knot(x, y, state){
  return state === 'open'
    ? el('circle',{class:'t-knot open', cx:x, cy:y, r:3.2})
    : el('circle',{class:'t-knot '+state, cx:x, cy:y, r:state==='leaf'?1.7:2.9});
}

function ctxDrawTree(ctx){
  const svg = ctx.svg;
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  ctx.famG = {};

  // "show only" mode: prune every branch down to what's actually live in the
  // selected country, instead of drawing the full tree and dimming the rest
  const filtering = (ctx === mainCtx) && countryTreeMode === 'filter' && !!countryLive;

  /* ---------- 1. layout ---------- */
  let posY = TOP;
  const rows = [], links = [], famY = {}, headings = [];

  function walk(list, level, parentY){
    const l = filtering ? list.filter(n=>countryLive.live.has(n.key)) : list;
    const bx = PX(level-1), cx = PX(level);
    l.forEach(n=>{
      const h = RH[n.kind];
      const y = posY + h/2;
      rows.push({kind:n.kind, node:n, y, level});
      links.push('M '+bx+' '+parentY+' L '+bx+' '+y+' L '+cx+' '+y);
      posY += h;
      if(ctx.open.has(n.key)){
        const kids = ctx.nodeChildren(n);
        if(kids && kids.length) walk(kids, level+1, y);
      }
    });
  }

  // the suborder heading belongs to whichever block is the first *surviving*
  // one under it — not always the first block in TREE order, since country
  // filtering can knock out that first superfamily while a later one (with
  // live families) still needs the suborder label above it
  let lastCladeShown = null;
  ctx.blocks.forEach(b=>{
    const members = filtering ? b.members.filter(f=>countryLive.liveFamilies.has(f)) : b.members;
    if(!members.length) return;
    const showSub = b.clade !== lastCladeShown;
    if(showSub) lastCladeShown = b.clade;
    posY += showSub ? GAP_SUB : GAP_SF;
    headings.push({b: Object.assign({}, b, {members, sub: showSub ? b.clade : null}), y0: posY + RH.fam/2});
    members.forEach(fam=>{
      const y = posY + RH.fam/2;
      famY[fam] = y;
      rows.push({kind:'fam', name:fam, y, level:0});
      posY += RH.fam;
      if(ctx.open.has('f:'+fam)){
        posY += 2;
        walk(ctx.famChildren(fam), 1, y);
        posY += 8;
      }
    });
  });

  // in "show only" mode the backbone (order > suborder > superfamily > family)
  // needs pruning down to just the live families too, or it'll try to draw
  // branches to families that never got a row (and therefore no Y position)
  function filterTree(node, liveFamilies){
    if(node.leaf) return liveFamilies.has(node.name) ? node : null;
    const kids = node.children.map(c=>filterTree(c, liveFamilies)).filter(Boolean);
    return kids.length ? Object.assign({}, node, {children: kids}) : null;
  }
  const backboneTree = filtering ? filterTree(ctx.tree, countryLive.liveFamilies) : ctx.tree;

  if(backboneTree){
    (function setDepth(n,d){ n.depth=d; if(!n.leaf) n.children.forEach(c=>setDepth(c,d+1)); })(backboneTree, 0);
    (function midY(n){
      if(n.leaf) return (n.y = famY[n.name]);
      n.children.forEach(midY);
      n.y = (n.children[0].y + n.children[n.children.length-1].y)/2;
      return n.y;
    })(backboneTree);
  }

  const H = posY + 22;
  svg.setAttribute('viewBox', `0 0 ${VW} ${H}`);
  svg.appendChild(el('rect',{x:0,y:0,width:VW,height:H,fill:'#16281a'}));

  /* ---------- 2. backbone, then the branches that continue below a family ---------- */
  const STEP = (TIPX - LEFT) / maxDepth;
  const xOf = n => n.leaf ? TIPX : LEFT + n.depth*STEP;
  if(backboneTree) (function draw(node){
    if(node.leaf) return;
    const px = xOf(node);
    node.children.forEach(c=>{
      svg.appendChild(el('path',{d:`M ${px} ${node.y} L ${px} ${c.y} L ${xOf(c)} ${c.y}`, class:'branch'}));
      draw(c);
    });
  })(backboneTree);
  links.forEach(d=> svg.appendChild(el('path',{d, class:'branch sub-branch'})));

  function heading(text, x, y, cls, fs){
    const w = text.length * fs * 0.78 + 16;
    svg.appendChild(el('rect',{class:'knock', x:x-7, y:y-fs-2, width:w, height:fs+9}));
    svg.appendChild(el('text',{x:x, y:y, class:cls}, text));
  }
  headings.forEach(({b,y0})=>{
    if(b.sub){
      heading(b.sub.toUpperCase(), LEFT, y0 - 75, 'sub-label', 16.5);
      svg.appendChild(el('line',{x1:LEFT,y1:y0-64,x2:COUNTX,y2:y0-64,stroke:'#8a6427','stroke-width':'.8'}));
    }
    const n = b.members.reduce((s,f)=>s+(filtering ? (countryLive.famCount[f]||0) : ctx.famInfo[f].species),0);
    heading(b.sf.toUpperCase(), LEFT+18, y0 - 32, 'sf-label', 13.5);
    const cx = LEFT+18 + b.sf.length*13.5*0.78 + 20;
    svg.appendChild(el('rect',{class:'knock',x:cx-6,y:y0-47,width:150,height:23}));
    svg.appendChild(el('text',{x:cx, y:y0-32, class:'sf-count'},
      b.members.length + (b.members.length===1?' family':' families') + ' · ~' + n + ' spp.'));
  });

  /* ---------- 4. rows ---------- */
  rows.forEach(r=>{
    if(r.kind === 'fam'){
      const d = ctx.famInfo[r.name], isOpen = ctx.open.has('f:'+r.name);
      const famSpecies = filtering ? (countryLive.famCount[r.name]||0) : d.species;
      const g = el('g',{
        class:'tip'+(isOpen?' fam-open':'')+(r.name===ctx.selected?' active':''),
        tabindex:'0', role:'button', 'aria-expanded':isOpen?'true':'false',
        'aria-label':r.name+' — '+d.common+', '+famSpecies+' species'
      });
      g.appendChild(el('rect',{class:'focus-ring',x:PX(0)-5,y:r.y-21,width:COUNTX-PX(0)+13,height:42,rx:2}));
      g.appendChild(el('rect',{class:'tip-hit',x:PX(0)-5,y:r.y-21,width:COUNTX-PX(0)+13,height:42}));
      g.appendChild(knot(PX(0), r.y, isOpen ? 'open' : 'shut'));
      g.appendChild(el('text',{class:'tip-name',x:LX(0),y:r.y-9}, r.name));
      g.appendChild(el('text',{class:'tip-common',x:LX(0),y:r.y+13}, d.common));
      g.appendChild(el('text',{class:'tip-count',x:COUNTX,y:r.y}, famSpecies===1?'1':'~'+famSpecies));
      const hit = ()=>ctxToggleFamily(ctx, r.name);
      g.addEventListener('click', hit);
      g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();hit();} });
      svg.appendChild(g);
      ctx.famG[r.name] = g;
      return;
    }

    const n = r.node, x = PX(r.level), lx = LX(r.level);
    const rawKids = ctx.nodeChildren(n) || [];
    const expandable = filtering ? rawKids.some(k=>countryLive.live.has(k.key)) : !!rawKids.length;
    const open = ctx.open.has(n.key);
    const g = el('g',{class:'trow'+(open?' open':'')+(expandable?'':' static'), tabindex:'0', role:'button', 'data-key':n.key});
    g.appendChild(el('rect',{class:'trow-hit', x:x-5, y:r.y-12, width:COUNTX-x+13, height:24}));
    g.appendChild(knot(x, r.y, expandable ? (open?'open':'shut') : 'leaf'));
    if(expandable) g.setAttribute('aria-expanded', open?'true':'false');
    else { g.removeAttribute('tabindex'); g.removeAttribute('role'); }

    if(r.kind === 'subfam' || r.kind === 'tribe'){
      const kids = n.children;
      const genCount = filtering ? liveGeneraCount(kids) : countGenera(kids);
      const spCount = filtering ? liveSpeciesCount(kids) : countSpecies(kids);
      g.setAttribute('aria-label', (r.kind==='subfam'?'Subfamily ':'Tribe ')+n.name);
      g.appendChild(el('text',{class:r.kind==='subfam'?'t-subfam':'t-tribe',x:lx,y:r.y},
        r.kind==='subfam' ? n.name : n.name.toUpperCase()));
      g.appendChild(el('text',{class:'t-count',x:COUNTX,y:r.y}, genCount+' genera · ~'+spCount+' spp.'));
      ctxBindToggle(ctx, g, n);
    } else if(r.kind === 'genus'){
      const liveN = filtering ? (countryLive.genusCount[n.name]||0) : n.n;
      g.setAttribute('aria-label', 'Genus '+n.name+', '+liveN+' species');
      g.appendChild(el('text',{class:'t-genus',x:lx,y:r.y}, n.name));
      g.appendChild(el('text',{class:'t-count',x:COUNTX,y:r.y}, liveN===1?'1 species':liveN+' spp.'));
      if(expandable) ctxBindToggle(ctx, g, n);
    } else {
      g.setAttribute('class','trow species'+(n.name===ctx.selectedSp?' active':''));
      g.setAttribute('tabindex','0'); g.setAttribute('role','button');
      g.setAttribute('aria-label', n.name+(n.note?' — '+n.note:''));
      const t = el('text',{x:lx,y:r.y,'dominant-baseline':'middle'});
      t.appendChild(el('tspan',{class:'t-species'}, n.name));
      if(n.note) t.appendChild(el('tspan',{class:'t-note',dx:'11'}, n.note));
      g.appendChild(t);
      const pick = ()=>ctxShowSpecies(ctx, n.name);
      const preload = ()=>preloadInatPhoto(n.name).catch(()=>{});
      g.addEventListener('click', pick);
      g.addEventListener('pointerenter', preload);
      g.addEventListener('focus', preload);
      g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();} });
    }
    svg.appendChild(g);
  });

  if(ctx.onDrawn) ctx.onDrawn();
}

function ctxBindToggle(ctx, g, n){
  const t = ()=>{ ctxToggle(ctx, n.key); };
  g.addEventListener('click', t);
  g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();t();} });
}
function ctxToggle(ctx, key){
  ctx.open.has(key) ? ctx.open.delete(key) : ctx.open.add(key);
  ctxDrawTree(ctx);
}
function ctxToggleFamily(ctx, name){
  const key = 'f:'+name, wasOpen = ctx.open.has(key);
  wasOpen ? ctx.open.delete(key) : ctx.open.add(key);
  ctx.selected = name; ctx.selectedSp = null;
  ctxDrawTree(ctx);
  ctxSelect(ctx, name);
  if(!wasOpen) ctxScrollFamIntoView(ctx, name);
}
function ctxScrollFamIntoView(ctx, name){
  const g = ctx.famG[name];
  const tip = g && g.querySelector('.tip-name');
  if(!tip) return;
  tip.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

function ctxCardReset(ctx){
  ctx.selected = null; ctx.selectedSp = null;
  ctx.card.classList.add('empty');
  ctx.card.innerHTML = ctx.emptyHTML;
  if(ctx === mainCtx) cmShowSpeciesRange(null);
}

function ctxSelect(ctx, name){
  ctx.selected = name; ctx.selectedSp = null;
  if(ctx === mainCtx) cmShowSpeciesRange(null);
  ctx.card.classList.remove('empty');
  Object.keys(ctx.famG).forEach(n=>ctx.famG[n].classList.toggle('active', n===name));
  ctx.svg.querySelectorAll('g.trow.species.active').forEach(g=>g.classList.remove('active'));
  const d = F[name];
  const stats = ctx.famInfo[name];
  const isOpen = ctx.open.has('f:'+name);
  ctx.card.innerHTML =
    '<p class="card-lineage">'+LINEAGE[name].join(' &rsaquo; ')+' &rsaquo; '+name+'</p>'+
    '<div class="name-row"><h3>'+name+'</h3><span class="common">'+d.common+'</span></div>'+
    '<p class="desc">'+d.desc+'</p>'+
    '<div class="chips">'+
      '<span class="chip"><b>'+stats.genera+'</b> '+(stats.genera===1?'genus':'genera')+'</span>'+
      '<span class="chip"><b>'+(stats.species===1?'1':'~'+stats.species)+'</b> '+(stats.species===1?'species':'spp.')+'</span>'+
    '</div>'+
    '<p class="range-line">Range: <b>'+d.range+'</b></p>'+
    '<button type="button" class="jump" data-fam="'+name+'">'+
      (isOpen ? 'Close this branch' : 'Open '+name+' in the tree')+' &rarr;</button>';
}

/* locate a genus within the ATLAS: which subfamily/tribe it hangs under */
function findGenusPath(family, genus){
  const subs = ATLAS[family];
  if(!subs) return null;
  for(let si=0; si<subs.length; si++){
    const sf = subs[si];
    for(let ti=0; ti<sf.tribes.length; ti++){
      const tr = sf.tribes[ti];
      if(tr.g.some(g=>g[0]===genus)) return {family, si, ti, hasSub: !!sf.sub, hasTribe: !!tr.t};
    }
  }
  return null;
}

/* scroll an arbitrary tree row into view on the page */
function scrollRowIntoView(g){
  const rect = g && g.querySelector('rect');
  if(!rect) return;
  rect.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

/* open the main tree's family/subfamily/tribe/genus branch down to one
   species and select it (used by search results, which always jump to
   the main tree regardless of which cladogram triggered the search) */
function openTreeToSpecies(family, genus, binomial, focusCard = false){
  const path = findGenusPath(family, genus);
  if(!path) return false;
  mainCtx.open.add('f:'+family);
  if(path.hasSub) mainCtx.open.add('s:'+family+'|'+path.si);
  if(path.hasTribe) mainCtx.open.add('t:'+family+'|'+path.si+'|'+path.ti);
  mainCtx.open.add('g:'+genus);
  ctxDrawTree(mainCtx);
  ctxShowSpecies(mainCtx, binomial);
  if(focusCard){
    mainCtx.card.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  } else {
    scrollRowIntoView(document.querySelector('g.trow.species.active'));
  }
  return true;
}

/* a species picked in any cladogram fills that instance's own panel */
function ctxShowSpecies(ctx, binomial){
  ctx.selectedSp = binomial; ctx.selected = null;
  ctx.card.classList.remove('empty');
  Object.keys(ctx.famG).forEach(n=>ctx.famG[n].classList.remove('active'));
  ctx.svg.querySelectorAll('g.trow.species').forEach(g=>{
    g.classList.toggle('active', g.getAttribute('aria-label').indexOf(binomial) === 0);
  });
  ctx.card.innerHTML = luSpeciesHTML(binomial, true);
  loadInatPhoto(binomial, ctx.card.querySelector('.inat-photo'));
  if(ctx === mainCtx) cmShowSpeciesRange(binomial);
  if(ctx.card.getBoundingClientRect().top < 0 || ctx.card.getBoundingClientRect().top > innerHeight-120){
    ctx.card.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
  }
}

/* =========================================================
   4. THE ATLAS — every family, subfamily, tribe and genus
   Structure: [subfamily, note, tribes] where a tribe is
   [tribe name or null, [[genus, species], ...]]
   ========================================================= */
const S = (sub,note,tribes)=>({sub,note,tribes});
const T = (t,g)=>({t,g});
const G = g => [T(null,g)];              // no tribes used
const P = g => [S(null,null,G(g))];      // no subfamilies used

const ATLAS = {

/* =========================================================
   5. SPECIES — one level below genus
   G:[complete?, [[epithet, common name], ...]]
   complete = 1 means every species in the genus is listed.
   complete = 0 means a representative selection only.
   Genera absent from this list have no species shown.
   ========================================================= */
const SP = {
// --- Mysticeti
Balaena:[1,[["mysticetus","Bowhead Whale"]]],
Eubalaena:[1,[["australis","Southern Right Whale"], ["glacialis","North Atlantic Right Whale"], ["japonica","North Pacific Right Whale"]]],

/* Data is bundled into this page by build.sh (see the JSON blocks at the end of
   the document). Opened straight from the working copy those blocks are empty
   and we fall back to fetching the files next to the page. */
const domReady = () => document.readyState === 'loading'
  ? new Promise(r=>document.addEventListener('DOMContentLoaded', r, {once:true}))
  : Promise.resolve();

function bundled(id, url){
  // the blocks sit at the end of the document, so wait for the parser to reach
  // them before looking; only then is falling back to fetch() meaningful
  return domReady().then(()=>{
    const el = document.getElementById(id);
    const txt = el ? el.textContent.trim() : '';
    if(txt.charAt(0) === '{' || txt.charAt(0) === '[') return JSON.parse(txt);
    return fetch(url, {cache: 'no-cache'}).then(r=>{
      if(!r.ok) throw new Error(url + ' — HTTP ' + r.status);
      return r.json();
    });
  });
}

// data/build_country_distribution.py adds countries GBIF has real occurrence
// records for but MDD's own countryDistribution column omits (see its
// docstring). MDD's column is a checklist that lags the records: without this
// it misses Svalbard entirely -- no walrus, no bowhead. Additive only -- it
// never removes or overrides a country MDD does assert.
function luMergeCountrySupplement(species, supplement){
  if(!supplement) return;
  species.forEach(s=>{
    const extra = supplement[s.sciName];
    if(!extra || !extra.length) return;
    const existing = new Set((s.countryDistribution||'').split('|')
      .map(x=>x.trim().replace(/\?$/,'').toLowerCase()).filter(Boolean));
    const add = extra.filter(c=>!existing.has(c.toLowerCase()));
    if(!add.length) return;
    s.countryDistribution = (s.countryDistribution && s.countryDistribution!=='NA')
      ? s.countryDistribution + '|' + add.join('|')
      : add.join('|');
  });
}

function wmNorm(x){
  return x.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
          .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

// "Angola|Benin?|..." -> what to paint
function wmResolve(list){
  const shapes = {}, dots = {};
  let named = 0, unmatched = 0;
  (list||'').split('|').forEach(raw=>{
    const t = raw.trim();
    if(!t || t==='NA') return;
    named++;
    const maybe = t.endsWith('?');
    const key = WMAP.index[wmNorm(maybe ? t.slice(0,-1) : t)];
    if(!key){ unmatched++; return; }
    const bag = key.indexOf('d:')===0 ? dots : shapes;
    // true means every record for this place was flagged uncertain
    bag[key] = (key in bag) ? (bag[key] && maybe) : maybe;
  });
  return {shapes, dots, named, unmatched};
}

/* ---- browse-by-country map: click a country, list bats confirmed there ---- */
let CM = null, cmReady = false, cmSelected = null;

function cmBuildIndex(){
  const byKey = {};
  luState.species.forEach(s=>{
    (s.countryDistribution||'').split('|').forEach(raw=>{
      const t = raw.trim();
      if(!t || t==='NA') return;
      const maybe = t.endsWith('?');
      const name = maybe ? t.slice(0,-1).trim() : t;
      if(!name) return;
      const key = WMAP.index[wmNorm(name)];
      if(!key) return;
      let e = byKey[key];
      if(!e) e = byKey[key] = { confirmed:[], maybe:[], name: key.indexOf('d:')===0 ? key.slice(2) : name };
      if(maybe) e.maybe.push(s); else e.confirmed.push(s);
    });
  });
  CM = byKey;
}

function cmRenderMap(){
  const mapEl = document.getElementById('cm-map-svg');
  if(!mapEl) return;
  let body = '<rect x="0" y="0" width="'+WMAP.w+'" height="'+WMAP.h+'" fill="#122015"/>';
  // dissolved land mass, under the countries: fills the sub-pixel slivers that
  // independent per-country simplification leaves along shared borders
  if(WMAP.land) body += '<path class="cm-land" d="'+WMAP.land+'"/>';
  body += WMBASE.map(([k,d])=>{
    const e = CM[k];
    const has = e && (e.confirmed.length || e.maybe.length);
    const inRange = speciesRange && (k in speciesRange.shapes);
    const cls = 'cm-c'+(has?' has':'')+(inRange?' range':'')+(k===cmSelected?' sel':'');
    const label = e ? e.name+' — '+e.confirmed.length+' species'+(e.maybe.length?', '+e.maybe.length+' uncertain':'') : '';
    return '<path class="'+cls+'" data-key="'+luEsc(k)+'" d="'+d+'">'+(label?'<title>'+luEsc(label)+'</title>':'')+'</path>';
  }).join('');
  if(cmSelected && WMAP.small.indexOf(cmSelected) >= 0){
    const c = WMAP.cent[cmSelected];
    if(c) body += '<circle class="cm-ring" cx="'+c[0]+'" cy="'+c[1]+'" r="5"/>';
  }
  Object.keys(WMAP.dots).forEach(k=>{
    const e = CM[k];
    const inRange = speciesRange && (k in speciesRange.dots);
    if(!(e && (e.confirmed.length || e.maybe.length)) && !inRange) return;
    const c = WMAP.dots[k];
    if(!c) return;
    const cls = 'cm-d'+(inRange?' range':'')+(k===cmSelected?' sel':'');
    const label = e ? e.name+' — '+e.confirmed.length+' species'+(e.maybe.length?', '+e.maybe.length+' uncertain':'') : '';
    body += '<circle class="'+cls+'" data-key="'+luEsc(k)+'" cx="'+c[0]+'" cy="'+c[1]+'" r="3">'+(label?'<title>'+luEsc(label)+'</title>':'')+'</circle>';
  });
  mapEl.innerHTML = '<svg viewBox="0 0 '+WMAP.w+' '+WMAP.h+'" role="img" aria-label="World map, click a country to filter the tree">'+
    '<g class="cm-zoom-g" id="cm-zoom-g">'+body+'</g></svg>';
  cmApplyView(true);
  cmUpdateLabel();
}

/* ---- pan / zoom: a transform on the <g> wrapping the map's own content,
   reapplied after every cmRenderMap() rebuild so a redraw (new country
   selected, a species range painted) doesn't reset the current view ---- */
let cmView = {scale:1, x:0, y:0};
let cmDrag = null; // {startClientX, startClientY, startX, startY} while a pointer is down
const CM_MIN_SCALE = 1, CM_MAX_SCALE = 12;

function cmClampView(v){
  const scale = Math.min(CM_MAX_SCALE, Math.max(CM_MIN_SCALE, v.scale));
  // keep at least a sliver of the map on-screen at any pan position
  const maxX = WMAP.w * 0.9, maxY = WMAP.h * 0.9;
  const minX = WMAP.w*(1-scale) - WMAP.w*0.9, minY = WMAP.h*(1-scale) - WMAP.h*0.9;
  return { scale, x: Math.min(maxX, Math.max(minX, v.x)), y: Math.min(maxY, Math.max(minY, v.y)) };
}

function cmApplyView(noAnim){
  const g = document.getElementById('cm-zoom-g');
  if(!g) return;
  g.classList.toggle('no-anim', !!noAnim);
  g.setAttribute('transform', 'translate('+cmView.x+' '+cmView.y+') scale('+cmView.scale+')');
}

function cmSetView(v, animate){
  cmView = cmClampView(v);
  cmApplyView(!animate);
}

function cmResetView(animate){ cmSetView({scale:1, x:0, y:0}, animate); }

// point a screen (client) coordinate to viewBox units, independent of how
// the svg itself is currently scaled on the page
function cmClientToViewBox(clientX, clientY){
  const svg = document.querySelector('#cm-map-svg svg');
  if(!svg) return null;
  const rect = svg.getBoundingClientRect();
  if(!rect.width || !rect.height) return null;
  return {
    x: (clientX - rect.left) / rect.width * WMAP.w,
    y: (clientY - rect.top) / rect.height * WMAP.h
  };
}

function cmZoomAt(vx, vy, factor){
  const newScale = Math.min(CM_MAX_SCALE, Math.max(CM_MIN_SCALE, cmView.scale * factor));
  const x = vx - (vx - cmView.x) / cmView.scale * newScale;
  const y = vy - (vy - cmView.y) / cmView.scale * newScale;
  cmSetView({scale:newScale, x, y}, false);
}

// centre the view on a country's centroid at a fixed, comfortable zoom level
function cmZoomToCountry(key){
  const isDot = key.indexOf('d:') === 0;
  const c = isDot ? WMAP.dots[key] : WMAP.cent[key];
  if(!c) return;
  const scale = isDot || WMAP.small.indexOf(key) >= 0 ? 7 : 3;
  cmSetView({ scale, x: WMAP.w/2 - scale*c[0], y: WMAP.h/2 - scale*c[1] }, true);
}

  }

function cmWireZoomControls(){
  const mapEl = document.getElementById('cm-map');
  if(!mapEl) return;
  mapEl.addEventListener('wheel', e=>{
    e.preventDefault();
    const p = cmClientToViewBox(e.clientX, e.clientY);
    if(!p) return;
    cmZoomAt(p.x, p.y, e.deltaY < 0 ? 1.35 : 1/1.35);
  }, {passive:false});

  mapEl.addEventListener('pointerdown', e=>{
    if(e.target.closest('.cm-zoom-ctrl')) return;
    const svg = document.querySelector('#cm-map-svg svg');
    if(!svg) return;
    cmDrag = {id:e.pointerId, svg, startClientX:e.clientX, startClientY:e.clientY, startX:cmView.x, startY:cmView.y, moved:false};
    // pointer capture is NOT taken here: capturing on pointerdown retargets
    // the pointerup/mouseup/click that follow to the capturing element even
    // for a plain click with zero movement (verified in Chromium — the up
    // and click events come back targeted at the <svg> root, never at the
    // country <path>/<circle> underneath), which silently breaks selecting a
    // country. Capture only gets taken once movement past the drag
    // threshold is confirmed, in pointermove below — a real click never
    // reaches that point, so it's never captured and resolves normally.
  });
  mapEl.addEventListener('pointermove', e=>{
    if(!cmDrag || e.pointerId !== cmDrag.id) return;
    const svg = cmDrag.svg;
    const rect = svg.getBoundingClientRect();
    if(!rect.width) return;
    // "did this become a drag" is judged in real screen pixels, not viewBox
    // units — the map can render anywhere from ~300px to 900px wide, so a
    // fixed viewBox-unit threshold could be under a single screen pixel and
    // flag ordinary mouse-hand jitter on a plain click as a drag
    if(!cmDrag.moved && (Math.abs(e.clientX-cmDrag.startClientX) > 4 || Math.abs(e.clientY-cmDrag.startClientY) > 4)){
      cmDrag.moved = true;
      svg.setPointerCapture(cmDrag.id);
      svg.classList.add('dragging');
    }
    if(!cmDrag.moved) return;
    const dx = (e.clientX - cmDrag.startClientX) / rect.width * WMAP.w;
    const dy = (e.clientY - cmDrag.startClientY) / rect.height * WMAP.h;
    cmSetView({scale:cmView.scale, x:cmDrag.startX+dx, y:cmDrag.startY+dy}, false);
  });
  function endDrag(e){
    if(!cmDrag || e.pointerId !== cmDrag.id) return;
    const svg = cmDrag.svg;
    if(cmDrag.moved){
      svg.classList.remove('dragging');
      if(svg.hasPointerCapture(cmDrag.id)) svg.releasePointerCapture(cmDrag.id);
      // a drag that actually moved the map shouldn't also register as a
      // click on whatever country happens to be under the pointer when it lifts
      cmSuppressNextClick = true;
    }
    cmDrag = null;
  }
  mapEl.addEventListener('pointerup', endDrag);
  mapEl.addEventListener('pointercancel', endDrag);

  document.getElementById('cm-zoom-in').addEventListener('click', ()=>cmZoomAt(WMAP.w/2, WMAP.h/2, 1.6));
  document.getElementById('cm-zoom-out').addEventListener('click', ()=>cmZoomAt(WMAP.w/2, WMAP.h/2, 1/1.6));
  document.getElementById('cm-zoom-reset').addEventListener('click', ()=>cmResetView(true));
}
let cmSuppressNextClick = false;

function cmOnMapClick(e){
  if(cmSuppressNextClick){ cmSuppressNextClick = false; return; }
  const el = e.target.closest('[data-key]');
  if(!el) return;
  const key = el.getAttribute('data-key');
  const entry = CM[key];
  if(!entry || (!entry.confirmed.length && !entry.maybe.length)) return;
  cmSelected = (cmSelected === key) ? null : key;
  cmRenderMap();
  applyCountryFilterToMainTree();
  if(cmSelected) cmZoomToCountry(cmSelected); else cmResetView(true);
}

function applyCountryFilterToMainTree(){
  if(!cmSelected){
    countrySpeciesSet = null; countryLive = null;
  } else {
    const e = CM[cmSelected];
    countrySpeciesSet = new Set((e ? e.confirmed : []).map(s=>luNiceName(s.sciName)));
    countryLive = computeCountryLiveKeys(countrySpeciesSet);
  }
  // a full redraw is needed (not just re-toggling the dim class): in "show
  // only" mode, which rows exist at all depends on the country selection
  ctxDrawTree(mainCtx);
}

function setCountryTreeMode(mode){
  if(countryTreeMode === mode) return;
  countryTreeMode = mode;
  document.getElementById('cm-mode-dim').setAttribute('aria-pressed', mode==='dim' ? 'true' : 'false');
  document.getElementById('cm-mode-filter').setAttribute('aria-pressed', mode==='filter' ? 'true' : 'false');
  ctxDrawTree(mainCtx);
}

document.getElementById('cm-mode-filter').addEventListener('click', ()=>setCountryTreeMode('filter'));

function cmMaybeInit(){

  cmReady = true;

}

function luNiceName(sci){ return sci.replace('_',' '); }
function luEsc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function luApplyFilter(){
  const q = luInput.value.trim().toLowerCase();
  if(!q){ luCloseResults(); return; }
  if(!luState.ready){
    luResults.innerHTML = '<div class="lu-none">'+(luState.error ? 'Could not load the taxonomy: '+luEsc(luState.error) : 'Loading the taxonomy…')+'</div>';
    luOpenResults();
    return;
  }
  luState.filtered = luState.species.filter(s=>{
    const dk = luState.danish[s.sciName];
    return (
      s.sciName.toLowerCase().replace('_',' ').includes(q) ||
      (s.mainCommonName||'').toLowerCase().includes(q) ||
      (s.otherCommonNames||'').toLowerCase().includes(q) ||
      s.genus.toLowerCase().includes(q) ||
      s.family.toLowerCase().includes(q) ||
      (dk && dk.allNames.some(n=>n.toLowerCase().includes(q)))
    );
  });
  luRenderResults();
  luOpenResults();
}

function luRenderResults(){
  const list = luState.filtered;
  if(!list.length){
    luResults.innerHTML = '<div class="lu-none">Nothing matches that. Try a genus, a family or a common name.</div>';
    return;
  }
  const shown = list.slice(0, LU_MAX);
  if(shown.length===1) prefetchInatPhotoById(shown[0].id);
  let html = '<div class="lu-count">'+list.length+' match'+(list.length===1?'':'es')+
             (list.length>LU_MAX ? ' — first '+LU_MAX+' shown' : '')+'</div>';
  html += shown.map(s=>{
    const dk = luState.danish[s.sciName];
    return '<div class="lu-row" role="option" tabindex="0" data-id="'+luEsc(s.id)+'">'+
      '<span class="lu-sci">'+luEsc(luNiceName(s.sciName))+'</span>'+
      (s.mainCommonName ? '<span class="lu-common">'+luEsc(s.mainCommonName)+'</span>' : '')+
      (dk ? '<span class="lu-common lu-dk">🇩🇰 '+luEsc(dk.name)+'</span>' : '')+
      '<span class="lu-fam">'+luEsc(s.family)+' · '+luEsc(s.genus)+'</span></div>';
  }).join('');
  if(luState.meta) html += '<div class="lu-foot">'+luEsc(luState.meta.source)+' — '+
    luState.meta.speciesCount+' species, '+luState.meta.genusCount+' genera, '+luState.meta.familyCount+' families</div>';
  luResults.innerHTML = html;
}

function luOpenResults(){ luResults.hidden = false; luInput.setAttribute('aria-expanded','true'); }
function luCloseResults(){ luResults.hidden = true; luInput.setAttribute('aria-expanded','false'); }

luResults.addEventListener('click', e=>{
  const row = e.target.closest('.lu-row');

});
function prefetchInatPhotoById(id){
  const species = luState.species.find(s=>s.id===id);
  if(species) preloadInatPhoto(luNiceName(species.sciName)).catch(()=>{});
}
function prefetchResultPhoto(e){

  if(row) prefetchInatPhotoById(row.dataset.id);
}
luResults.addEventListener('pointerover', prefetchResultPhoto);
luResults.addEventListener('focusin', prefetchResultPhoto);
luResults.addEventListener('keydown', e=>{
  const row = e.target.closest('.lu-row');
  if(row && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); luSelectSpecies(row.dataset.id); }
});
luInput.addEventListener('input', luApplyFilter);
luInput.addEventListener('focus', ()=>{ if(luInput.value.trim()) luApplyFilter(); });
luInput.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ luCloseResults(); luInput.blur(); }
  if(e.key==='ArrowDown'){
    const first = luResults.querySelector('.lu-row');
    if(first){ e.preventDefault(); first.focus(); }
  }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.tb-search')) luCloseResults();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ luCloseDrawer(); luCloseResults(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!typing && (e.key==='/' || ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'))){
    e.preventDefault(); luInput.focus(); luInput.select();
  }
});

let luDrawerReturnFocus = null;
function luDrawerTrap(e){
  if(e.key !== 'Tab') return;
  const focusable = luDrawer.querySelectorAll('a[href],button:not([disabled]),input,[tabindex]:not([tabindex="-1"])');
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function luOpenDrawer(){
  luDrawerReturnFocus = document.activeElement;
  luDrawer.classList.add('open'); luScrim.classList.add('open');
  luDrawer.setAttribute('aria-hidden','false');
  luDrawer.scrollTop = 0;
  document.getElementById('lu-close').focus();
  luDrawer.addEventListener('keydown', luDrawerTrap);
}
function luCloseDrawer(){
  luDrawer.classList.remove('open'); luScrim.classList.remove('open');
  luDrawer.setAttribute('aria-hidden','true');
  luDrawer.removeEventListener('keydown', luDrawerTrap);
  if(luDrawerReturnFocus && document.contains(luDrawerReturnFocus)) luDrawerReturnFocus.focus();
  luDrawerReturnFocus = null;
}
luScrim.addEventListener('click', luCloseDrawer);
document.getElementById('lu-close').addEventListener('click', luCloseDrawer);

function luStatusClass(code){ return (code||'na').toLowerCase(); }

function luFindEcho(species){
  const fam = luState.echo && luState.echo.families[species.family];
  if(!fam) return null;
  const sciSpace = luNiceName(species.sciName);
  const genusExample = fam.genusExamples && (fam.genusExamples[sciSpace] || fam.genusExamples[species.genus]);
  return { base: fam, override: genusExample || null };
}

function luSpeciesHTML(binomial, compact){
  const s = luState.byName[binomial.toLowerCase()];
  if(!s){
    return '<p class="lu-d-sci">'+luEsc(binomial)+'</p>'+
      '<p class="lu-prov">'+(luState.ready
        ? 'No record under this name in the Mammal Diversity Database export — most likely a spelling variant of a name the database files differently.'
        : 'The species records have not loaded yet. This page needs to be served over http for them to load.')+'</p>';
  }
  return luDetailHTML(s, compact);
}

const inatPhotoCache = new Map();
const inatPhotoPreloads = new Map();
function inatPhotoURL(url){
  return String(url||'').replace(/\/(square|medium)\./, '/small.');
}
function inatObservationPhoto(binomial){
  const params = new URLSearchParams({
    taxon_name:binomial,
    photos:'true',
    quality_grade:'research',
    photo_license:'cc0,cc-by,cc-by-sa',
    order_by:'votes',
    order:'desc',
    per_page:'1'
  });
  return fetch('https://api.inaturalist.org/v1/observations?'+params)
    .then(r=>{ if(!r.ok) throw new Error('iNaturalist HTTP '+r.status); return r.json(); })
    .then(data=>{
      const observation = (data.results||[]).find(o=>o.photos && o.photos.length);
      const photo = observation && observation.photos[0];
      if(!photo) return null;
      return {
        url:inatPhotoURL(photo.url),
        href:'https://www.inaturalist.org/observations/'+observation.id,
        attribution:photo.attribution||'iNaturalist contributor',
        license:(photo.license_code||'').toUpperCase()
      };
    });
}
function fetchInatPhoto(binomial){
  if(inatPhotoCache.has(binomial)) return inatPhotoCache.get(binomial);
  const params = new URLSearchParams({
    q:binomial,
    rank:'species',
    per_page:'5'
  });
  const request = fetch('https://api.inaturalist.org/v1/taxa?'+params)
    .then(r=>{ if(!r.ok) throw new Error('iNaturalist HTTP '+r.status); return r.json(); })
    .then(data=>{
      const taxon = (data.results||[]).find(t=>t.name && t.name.toLowerCase()===binomial.toLowerCase());
      const photo = taxon && taxon.default_photo;
      if(!photo || !photo.license_code) return inatObservationPhoto(binomial);
      return {
        url:inatPhotoURL(photo.url),
        href:'https://www.inaturalist.org/taxa/'+taxon.id,
        attribution:photo.attribution||'iNaturalist contributor',
        license:(photo.license_code||'').toUpperCase()
      };
    })
    .catch(err=>{ inatPhotoCache.delete(binomial); throw err; });
  inatPhotoCache.set(binomial, request);
  return request;
}
function preloadInatPhoto(binomial){
  return fetchInatPhoto(binomial).then(photo=>{
    if(photo && !inatPhotoPreloads.has(binomial)){
      const image = new Image();
      image.src = photo.url;
      inatPhotoPreloads.set(binomial, image);
    }
    return photo;
  });
}
async function loadInatPhoto(binomial, host){
  if(!host) return;
  try {
    const photo = await fetchInatPhoto(binomial);
    if(!host.isConnected) return;
    if(!photo){ host.remove(); return; }
    host.removeAttribute('aria-busy');
    host.innerHTML = '<a href="'+luEsc(photo.href)+'" target="_blank" rel="noopener noreferrer">'+
      '<img src="'+luEsc(photo.url)+'" alt="'+luEsc(binomial)+'" loading="eager" fetchpriority="high" decoding="async">'+
      '<figcaption>'+luEsc(photo.attribution)+(photo.license?' · '+luEsc(photo.license):'')+' · iNaturalist</figcaption></a>';
    const image = host.querySelector('img');
    image.addEventListener('error', ()=>host.remove(), {once:true});
  } catch (_) {
    if(host.isConnected) host.remove();
  }
}

function luDetailHTML(s, compact){
  const echo = luFindEcho(s);
  const merged = echo ? Object.assign({}, echo.base, echo.override||{}) : null;
  const dk = luState.danish[s.sciName];
  const bin = luNiceName(s.sciName);

  // the full rank ladder, shown as one breadcrumb above the name
  const lineage = ['order','suborder','infraorder','superfamily','family','subfamily','tribe','genus']
    .filter(k=>s[k] && s[k]!=='NA')
    .map(k=>luEsc(s[k])).join(' &rsaquo; ');

  const callRows = [];
  if(ESP[bin]) callRows.push('<dt>Species call</dt><dd>'+luEsc(ESP[bin])+'</dd>');
  if(merged){
    callRows.push('<dt>Call type</dt><dd>'+luEsc(merged.callType||'—')+'</dd>');
    callRows.push('<dt>Duty cycle</dt><dd>'+luEsc(merged.dutyCycle||'—')+'</dd>');
    callRows.push('<dt>Reference range</dt><dd>'+(merged.peakFrequencyKHz ? luEsc(merged.peakFrequencyKHz.join('–'))+' kHz' : '—')+'</dd>');
  }
  const callSection = '<section class="lu-section"><h4>Call</h4>'+
    (callRows.length ? '<dl>'+callRows.join('')+'</dl>' : '<p class="lu-note">No reference data for '+luEsc(s.family)+'.</p>')+
    (merged && merged.foragingNote ? '<p class="lu-note">'+luEsc(merged.foragingNote)+'</p>' : '')+
    (merged ? '<p class="lu-src">'+(echo.override ? 'Genus reference' : 'Family reference')+'. Not verified per species.</p>' : '')+
    '</section>';

  const links = LINKS.map(([label,url,icon])=>
    '<a href="'+url(bin)+'" target="_blank" rel="noopener noreferrer" aria-label="'+luEsc(label)+'" title="'+luEsc(label)+'">'+icon+'</a>').join('');

  return '<figure class="inat-photo" aria-busy="true"></figure>'+
    '<p class="card-lineage">'+lineage+'</p>'+
    '<p class="lu-d-sci">'+luEsc(bin)+'</p>'+
    (s.mainCommonName ? '<p class="lu-d-common">'+luEsc(s.mainCommonName)+(s.otherCommonNames ? ' · '+luEsc(s.otherCommonNames) : '')+'</p>' : '')+
    (dk ? '<p class="lu-d-common lu-dk">🇩🇰 '+luEsc(dk.allNames.join(' / '))+' <span class="lu-dk-src">('+luEsc(dk.source)+')</span></p>' : '')+
    '<p class="lu-d-authority">'+luEsc((s.authoritySpeciesAuthor||'')+' '+(s.authoritySpeciesYear||''))+'</p>'+
    '<div class="lu-links">'+links+'</div>'+
    '<div class="lu-facts">'+
      '<section class="lu-section"><h4>Taxonomy &amp; status</h4><dl>'+
        '<dt>IUCN status</dt><dd><span class="lu-status '+luStatusClass(s.iucnStatus)+'">'+(s.iucnStatus||'NA')+'</span></dd>'+
        '<dt>Extinct</dt><dd>'+(s.extinct==='1' ? 'Yes' : 'No')+'</dd>'+
        '<dt>Realm</dt><dd>'+luEsc(s.biogeographicRealm||'—')+'</dd>'+
        '<dt>Continents</dt><dd>'+luEsc((s.continentDistribution||'—').replace(/\|/g,', '))+'</dd>'+
        '<dt>Countries</dt><dd>'+luEsc((s.countryDistribution||'—').replace(/\|/g,', '))+'</dd>'+
      '</dl></section>'+
      callSection+
    '</div>'+
    '<p class="lu-prov">Sources: <a href="https://doi.org/10.5281/zenodo.21654811" target="_blank" rel="noopener">MDD v2.5</a>'+
    (dk ? ' · <a href="https://www.gbif.org" target="_blank" rel="noopener">GBIF</a>' : '')+'</p>';
}

function luSelectSpecies(id, focusCard = false){
  luState.active = id;
  luCloseResults();
  const s = luState.species.find(x=>x.id===id);
  if(!s) return;
  const binomial = luNiceName(s.sciName);
  preloadInatPhoto(binomial).catch(()=>{});
  const opened = openTreeToSpecies(s.family, s.genus, binomial, focusCard);
  if(!opened){
    // fallback for anything not represented in the cladogram
    luDetail.innerHTML = luDetailHTML(s, false);
    loadInatPhoto(binomial, luDetail.querySelector('.inat-photo'));
    luOpenDrawer();
  }
}

const treeToggle = document.getElementById('t-toggle');
function positionTreeTools(){
  const tools = document.querySelector('.tree-tools');
  const box = document.querySelector('.treebox');
  const heading = svg.querySelector('.sub-label');
  const scale = svg.clientWidth / VW;
  if(!tools || !box || !heading || !scale) return;
  const boxRect = box.getBoundingClientRect();
  const headingRect = heading.getBoundingClientRect();
  tools.style.top = Math.max(4, headingRect.top-boxRect.top+(headingRect.height-tools.offsetHeight)/2)+'px';
  tools.style.right = Math.max(8, 24*scale)+'px';
}
function allFamiliesOpen(){
  return BLOCKS.every(b=>b.members.every(f=>mainCtx.open.has('f:'+f)));
}
function updateTreeToggle(){
  const expanded = allFamiliesOpen();
  const label = expanded ? 'Collapse all branches' : 'Expand all branches';
  treeToggle.setAttribute('aria-label', label);
  treeToggle.title = label;
  treeToggle.querySelector('path').setAttribute('d', expanded
    ? 'M6 3l6 6 6-6M6 21l6-6 6 6'
    : 'M6 9l6-6 6 6M6 15l6 6 6-6');
  treeToggle.setAttribute('aria-pressed', expanded ? 'true' : 'false');
}

mainCtx = makeTreeCtx({
  svg, card: document.getElementById('card'),
  tree: TREE, blocks: BLOCKS, famInfo: F,
  famChildren, nodeChildren: n => n.kind==='genus' ? genusChildren(n.name) : (n.children||null),
  emptyHTML: '',
  onDrawn: ()=>{ applyTreeDim(); updateTreeToggle(); positionTreeTools(); }
});

addEventListener('resize', positionTreeTools, {passive:true});
if(document.fonts) document.fonts.ready.then(positionTreeTools);

ctxCardReset(mainCtx);
ctxDrawTree(mainCtx);

mainCtx.card.addEventListener('click', e=>{
  const btn = e.target.closest('.jump');
  if(btn){ ctxToggleFamily(mainCtx, btn.dataset.fam); return; }
});

treeToggle.addEventListener('click', ()=>{
  const expanded = allFamiliesOpen();
  BLOCKS.forEach(b=>b.members.forEach(f=>{
    expanded ? mainCtx.open.delete('f:'+f) : mainCtx.open.add('f:'+f);
  }));
  if(expanded) ctxCardReset(mainCtx);
  ctxDrawTree(mainCtx);
  if(expanded) document.querySelector('.treebox').scrollIntoView({block:'nearest'});
});
