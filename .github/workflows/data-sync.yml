name: Propose data update

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      refresh_media:
        description: Refresh eligible image snapshots
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check MDD release
        id: source
        run: uv run data/check_mdd_release.py
      - name: Rebuild derived data
        if: ${{ steps.source.outputs.changed == 'true' }}
        env:
          MDD_LATEST: '1'
        run: |
          uv run data/build_taxonomy.py
          uv run data/build_marine_mammal_taxonomy.py
          uv run data/build_danish_names.py
          uv run data/build_marine_mammal_danish_names.py
          uv run data/build_country_distribution.py
          uv run data/build_marine_mammal_country_distribution.py
          uv run data/build_call_records.py
          uv run data/build_media_manifest.py
      - name: Refresh media
        if: ${{ inputs.refresh_media }}
        run: uv run --with pillow data/sync_media.py
      - name: Validate proposal
        if: ${{ steps.source.outputs.changed == 'true' || inputs.refresh_media }}
        run: |
          uv run data/build_marine_mammal_page.py
          uv run data/build_release_manifest.py
          uv run data/validate_release.py
          sh build.sh
          uv run data/smoke_test.py
      - name: Write change report
        if: ${{ steps.source.outputs.changed == 'true' || inputs.refresh_media }}
        run: |
          git diff --stat > /tmp/data-update-report.txt
          git diff --numstat -- data/*.json >> /tmp/data-update-report.txt
      - name: Create review PR
        if: ${{ steps.source.outputs.changed == 'true' || inputs.refresh_media }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/data-update
          delete-branch: true
          title: Propose data update
          commit-message: Refresh derived data
          body-path: /tmp/data-update-report.txt
