<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d140f">
<link rel="manifest" href="manifest.webmanifest">
<script>
try {
  const savedTheme = localStorage.getItem('chiroptera-theme');
  const theme = savedTheme === 'light' || savedTheme === 'dark'
    ? savedTheme
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f3f0e5' : '#0d140f';
} catch (_) {
  document.documentElement.dataset.theme = 'dark';
}
</script>
<title>Chiroptera — bat tree and range map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --display:"Fraunces",Georgia,serif;
  --body:"Lexend","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;

  --pad:clamp(18px,4vw,56px);
}

/* ===== PALETTE =====================================================
   Every colour in the sheet resolves through these two blocks, so the
   whole palette is one swappable unit: data/build_marine_mammal_page.py
   lifts the region between these markers out and drops the marine one in.
   Nothing below this region names a colour directly -- if you find
   yourself adding a hex further down, add a token here instead.

   Chiroptera reads as a cave at night: dark leaf-litter ground, lichen
   green for structure, and one warm lamplit accent to touch.
   =================================================================== */
:root{
  color-scheme:dark;
  --abyss:#0d140f;          /* page ground */
  --prussian:#1a2f1c;       /* raised surface */
  --prussian-2:#22422a;
  --panel:#101d16;          /* drawer, search results */
  --canvas:#16281a;         /* the tree's own field */
  --line:#a9c98c;           /* structure: rules, branches, labels */
  --line-dim:#5b7a49;
  --rule:#8a6427;           /* the hairline under a suborder heading */
  --bone:#f4f1e6;           /* brightest ink */
  --text:#dfe4d6;
  --muted:#b7bfa9;
  --ochre:#e8ab4c;          /* the one accent: selection, focus, active */
  --ochre-dim:#8a6427;

  --ink-strong:#eef0e2;     /* tree rows, genus down to species */
  --ink-mid:#c3cdb8;
  --ink-soft:#adb9a0;
  --ink-faint:#8f9c85;
  --knot-leaf:#567f52;
  --footer-ink:#b8c2ac;
  --placeholder:#899783;

  --map-water:#122015;      /* the range map, unpainted */
  --map-land:#274a2e;
  --map-has:#345f3a;        /* a country this taxon is recorded in */
  --map-has-hover:#4a7a49;
  --map-dot:#5c8759;        /* islands too small to draw as shapes */
  --map-dot-hover:#7fae6e;
  --range-hover:#a9822f;

  /* IUCN status is data, not decoration: these stay put across palettes */
  --st-good:#8fd19e;  --st-good-b:#3a6b45;
  --st-bad:#e88a8a;   --st-bad-b:#8a3a3a;

  /* triplets, for the places that need an alpha */
  --border-rgb:150,190,120;
  --border2-rgb:178,210,150;
  --hover-rgb:178,210,150;
  --ochre-rgb:232,171,76;
  --abyss-rgb:13,20,15;
  --card-rgb:14,26,19;
  --scrim-rgb:9,14,10;
  --input-rgb:26,47,28;
  --glow-rgb:45,80,48;
  --card-a:.75; --bar-a:.88; --input-a:.85; --scrim-a:.62;
  --shadow:0 26px 64px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  color-scheme:light;
  --abyss:#f3f0e5;
  --prussian:#e4eadc;
  --prussian-2:#d4dfca;
  --panel:#eef0e5;
  --canvas:#e8ecdf;
  --line:#315f3a;
  --line-dim:#7d9272;
  --rule:#6f896b;
  --bone:#17251a;
  --text:#26352a;
  --muted:#5d6d5d;
  --ochre:#9b5c13;
  --ochre-dim:#b98a4d;

  --ink-strong:#1d2c20;
  --ink-mid:#394b3b;
  --ink-soft:#60705d;
  --ink-faint:#60705d;
  --knot-leaf:#64835f;
  --footer-ink:#526552;
  --placeholder:#677766;

  --map-water:#dfe7d8;
  --map-land:#b8c9af;
  --map-has:#8fab84;
  --map-has-hover:#70966d;
  --map-dot:#71936d;
  --map-dot-hover:#527a54;
  --range-hover:#b37222;

  --st-good:#266438;  --st-good-b:#579664;
  --st-bad:#9b3232;   --st-bad-b:#bd6b6b;

  --border-rgb:150,190,120;
  --border2-rgb:150,190,120;
  --hover-rgb:49,95,58;
  --ochre-rgb:155,92,19;
  --abyss-rgb:243,240,229;
  --card-rgb:228,234,220;
  --scrim-rgb:33,45,35;
  --input-rgb:228,234,220;
  --glow-rgb:113,145,104;
  --card-a:.78; --bar-a:.9;  --input-a:.92; --scrim-a:.42;
  --shadow:0 22px 52px rgba(40,52,38,.18);
}
/* ===== /PALETTE ==================================================== */

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
.fbtn,.gen,.switch button,.tree-tools button,.jump,#fclear,.lu-close,g.tip,g.trow,button.gen{
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(var(--ochre-rgb),.25);
}
body{
  margin:0;
  background:var(--abyss);
  color:var(--text);
  font-family:var(--body);
  font-weight:400;
  font-size:16.5px;
  line-height:1.62;
  overflow-x:hidden;
}

/* paper grain */
body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;z-index:99;
  opacity:.09;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23g)'/></svg>");
}
body::after{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:98;
  background:radial-gradient(120% 90% at 50% 8%, rgba(var(--glow-rgb),.16), rgba(var(--abyss-rgb),0) 62%);
}

.wrap{max-width:1640px;margin:0 auto;padding:0 var(--pad)}

/* ---------- tree and map workspace ---------- */
.top-grid{display:grid;grid-template-columns:1fr}
#tree-section,#country-map{
  padding-top:clamp(18px,2.6vw,28px);
  border-top:none;
}
#country-map{padding-bottom:0}
@media (min-width:1300px){
  .top-grid{
    grid-template-columns:minmax(0,5fr) minmax(0,7fr);
    column-gap:56px;
  }
  #tree-section{grid-column:1;min-width:0}
  #country-map{grid-column:2;min-width:0}
}

section{padding:clamp(40px,5.5vw,72px) 0;border-top:1px solid rgba(var(--border-rgb),.2);scroll-margin-top:70px}

/* ---------- tree ---------- */
.treebox{
  position:relative;
  margin-top:0;
  border:1px solid rgba(var(--border-rgb),.22);
  background:var(--canvas);
  border-radius:3px;
  overflow-x:auto;
  overflow-y:visible;
  -webkit-overflow-scrolling:touch;
}
svg#tree{display:block;width:100%;height:auto}
.tree-bg{fill:var(--canvas)}
.tree-rule{stroke:var(--rule)}
.cm-bg{fill:var(--map-water)}
.branch{stroke:var(--line-dim);stroke-width:1.2;fill:none;stroke-linecap:square}
.tip-hit{fill:transparent;cursor:pointer}
.tip-name{font-family:var(--display);font-size:19px;font-weight:500;fill:var(--bone);cursor:pointer;dominant-baseline:middle}
.tip-common{font-family:var(--body);font-size:15px;fill:var(--ink-soft);dominant-baseline:middle}
.tip-count{font-family:var(--mono);font-size:14.5px;fill:var(--muted);text-anchor:end;dominant-baseline:middle}
.sub-label{font-family:var(--mono);font-size:16.5px;letter-spacing:.26em;text-transform:uppercase;fill:var(--ochre)}
.sf-label{font-family:var(--mono);font-size:13.5px;letter-spacing:.2em;text-transform:uppercase;fill:var(--line)}
.sf-count{font-family:var(--mono);font-size:13.5px;letter-spacing:.06em;fill:var(--ink-faint)}
.knock{fill:var(--canvas)}
g.tip:hover .tip-name,g.tip:focus-visible .tip-name{fill:var(--ochre)}
g.tip:hover .branch-tip,g.tip.active .branch-tip{stroke:var(--ochre);stroke-width:2}
g.tip.active .tip-name{fill:var(--ochre)}
g.tip:focus-visible{outline:none}
.focus-ring{fill:none;stroke:none}
g.tip:focus-visible .focus-ring{stroke:var(--ochre);stroke-width:1;stroke-dasharray:3 3}

/* ---------- detail card (dense) ---------- */
.card.empty{display:none}
.card .lu-d-sci{font-size:19px;padding-right:0}
.card .lu-d-common{font-size:12.5px;margin:3px 0 0}
.card .lu-d-authority{font-size:10px;margin-top:2px}
.card .lu-links{margin-top:10px;gap:6px 10px}
.card .lu-links a{width:28px;height:28px}
.card .lu-facts{gap:12px;margin-top:12px;padding-top:0}
.card .lu-section{padding:11px 14px}
.card .lu-section h4{margin-bottom:7px;font-size:9.5px}
.card .lu-section dl{gap:3px 10px;font-size:12.5px}
.card .lu-section .lu-note{margin-top:8px;font-size:12.5px}
.card .lu-status{padding:1px 7px}
.card .lu-prov{margin-top:12px;font-size:11px;padding-top:10px}
.card .lu-facts,.card .lu-prov{clear:both}
.inat-photo{
  float:right;width:min(34%,220px);min-height:120px;aspect-ratio:4/3;margin:0 0 14px 18px;
  overflow:hidden;border:1px solid rgba(var(--border-rgb),.25);border-radius:2px;
  background:linear-gradient(110deg,var(--prussian) 35%,var(--prussian-2) 50%,var(--prussian) 65%);
  background-size:220% 100%;animation:photo-loading 1.4s linear infinite;
}
.inat-photo:not([aria-busy="true"]){min-height:0;animation:none;background:none;border:none;overflow:visible}
.inat-photo a{display:block;color:var(--muted);text-decoration:none}
.inat-photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:transparent}
.inat-photo figcaption{margin-top:6px;font:9px/1.45 var(--mono);letter-spacing:.03em;color:var(--muted)}
.inat-photo a:hover figcaption{color:var(--ochre)}
@keyframes photo-loading{to{background-position:-220% 0}}
@media (max-width:600px){
  .inat-photo{float:none;width:100%;max-width:280px;margin:0 auto 14px}
}

/* sits below the tree + map grid — the one shared detail card */
.card{
  border:1px solid rgba(var(--border-rgb),.28);border-left:3px solid var(--ochre);
  background:rgba(var(--card-rgb),var(--card-a));padding:14px 18px;border-radius:2px;
  margin:0 0 20px;scroll-margin-top:72px;
}

.card-lineage{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;line-height:1.55}
.card .name-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 7px}
.card h3{font-family:var(--display);font-weight:500;font-size:19px;margin:0;line-height:1.05}
.card .common{font-size:12.5px;color:var(--ochre);margin:0}
.card p.desc{margin:0 0 10px;max-width:64ch;color:var(--text);font-size:13px;line-height:1.48}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 9px}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--bone);
  background:rgba(var(--border2-rgb),.1);border:1px solid rgba(var(--border2-rgb),.22);border-radius:20px;
  padding:4px 11px;
}
.chip b{color:var(--ochre);font-weight:500;font-family:var(--mono)}
.range-line{font-size:12.5px;color:var(--muted);margin:0 0 9px}
.range-line b{color:var(--text);font-weight:400}
.jump{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:none;padding:0;color:var(--ochre);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ochre-dim);
  transition:.18s;
}
.jump:hover{color:var(--bone);background:none}

/* ---------- footer ---------- */
footer{border-top:1px solid rgba(var(--border2-rgb),.2);padding:24px 0 32px;color:var(--footer-ink);font:10.5px/1.6 var(--mono);letter-spacing:.04em}
footer a{color:var(--line);text-underline-offset:3px}
footer a:hover{color:var(--ochre)}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ---------- sticky topbar with the search field ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(var(--abyss-rgb),var(--bar-a));backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(var(--border-rgb),.2);
}
.topbar-in{
  max-width:1640px;margin:0 auto;padding:10px var(--pad);
  display:flex;align-items:center;gap:20px;min-height:58px;
}
.tb-brand{font-family:var(--display);font-size:17px;font-weight:500;color:var(--bone);text-decoration:none;white-space:nowrap}
.tb-brand em{font-style:italic;color:var(--line)}

/* The two trees are sister pages, so the way across is a switch rather than
   a link: both destinations always visible, the current one held down. It
   sits with the title because it names what you are looking at. */
.pageswitch{
  display:flex;flex:none;gap:2px;padding:2px;
  border:1px solid rgba(var(--border-rgb),.26);border-radius:999px;
  background:rgba(var(--card-rgb),.5);
}
.ps-opt{
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;white-space:nowrap;
  padding:6px 13px;border-radius:999px;transition:color .15s,background .15s;
}
.ps-opt:hover{color:var(--bone)}
.ps-opt[aria-current="page"]{
  background:rgba(var(--ochre-rgb),.15);color:var(--ochre);
  box-shadow:inset 0 0 0 1px rgba(var(--ochre-rgb),.34);
}
.ps-opt:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.tb-nav{display:flex;gap:18px}
.tb-nav a{
  display:flex;align-items:center;justify-content:center;width:32px;height:32px;
  color:var(--muted);text-decoration:none;border:0;transition:.15s;
}
.tb-nav a:hover{color:var(--ochre)}
.tb-nav a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.tb-nav svg{width:17px;height:17px;fill:currentColor}

.random-bat{
  display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;
  color:var(--muted);background:transparent;border:0;cursor:pointer;transition:.15s;
}
.random-bat:hover:not(:disabled){color:var(--ochre)}
.random-bat:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.random-bat:disabled{opacity:.38;cursor:wait}
.random-bat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.theme-toggle{
  width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:none;
  background:transparent;border:0;color:var(--muted);padding:6px;cursor:pointer;transition:.15s;
}
.theme-toggle:hover{color:var(--ochre)}
.theme-toggle:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.theme-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.theme-moon{display:none}
:root[data-theme="light"] .theme-sun{display:none}
:root[data-theme="light"] .theme-moon{display:block}

.tb-search{margin-left:auto;position:relative;width:min(330px,58vw)}
.tb-search input{
  width:100%;background:rgba(var(--input-rgb),var(--input-a));border:1px solid var(--line-dim);color:var(--text);
  font-family:var(--body);font-size:13.5px;padding:8px 44px 8px 32px;border-radius:999px;
}
.tb-search input::placeholder{color:var(--placeholder)}
.tb-search input:focus{outline:none;border-color:var(--ochre);background:var(--prussian)}
.tb-ico,.tb-kbd{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--line-dim)}
.tb-ico{left:11px;font-size:12px}
.tb-kbd{right:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;transition:opacity .15s}
.tb-search input:focus + .tb-kbd{opacity:0}

.tb-results{
  position:absolute;top:calc(100% + 9px);right:0;width:min(440px,90vw);
  max-height:min(560px,70vh);overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel);border:1px solid var(--line-dim);border-radius:4px;
  box-shadow:var(--shadow);
}
.tb-results .lu-foot{
  padding:9px 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--line-dim);
  border-top:1px solid rgba(var(--border-rgb),.16);
}
.lu-none{padding:18px 14px;font-size:13px;color:var(--muted);font-style:italic}
.lu-count{
  padding:8px 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--line-dim);border-bottom:1px solid rgba(var(--border-rgb),.16);
}

/* ---------- species drawer ---------- */
.lu-scrim{position:fixed;inset:0;background:rgba(var(--scrim-rgb),var(--scrim-a));z-index:70;opacity:0;pointer-events:none;transition:opacity .26s}
.lu-scrim.open{opacity:1;pointer-events:auto}
.lu-drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(640px,94vw);z-index:80;
  background:var(--panel);border-left:1px solid var(--line-dim);
  transform:translateX(101%);transition:transform .28s cubic-bezier(.2,.7,.2,1);
  overflow-y:auto;overscroll-behavior:contain;padding:clamp(22px,3vw,36px);
}
.lu-drawer.open{transform:none}
.lu-close{
  position:absolute;top:14px;right:16px;z-index:2;
  background:transparent;border:1px solid var(--line-dim);color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 12px;border-radius:2px;cursor:pointer;
}
.lu-close:hover{border-color:var(--ochre);color:var(--ochre)}

/* ---------- lookup rows & detail (shared by dropdown and drawer) ---------- */
.lu-row{padding:9px 14px;border-bottom:1px solid rgba(var(--border-rgb),.10);cursor:pointer}
.lu-row:hover,.lu-row:focus-visible{background:var(--prussian);outline:none}
.lu-row.active{background:var(--prussian-2);border-left:3px solid var(--ochre);padding-left:11px}
.lu-row .lu-sci{font-style:italic;font-family:var(--display);font-size:14.5px;color:var(--bone)}
.lu-row .lu-common{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.lu-row .lu-common.lu-dk{color:var(--ochre)}
.lu-row .lu-fam{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--line-dim);margin-top:2px;text-transform:uppercase}
.lu-empty{color:var(--muted);font-style:italic;padding-top:8vh;text-align:center}
.lu-d-sci{font-family:var(--display);font-style:italic;font-size:clamp(24px,3.4vw,34px);margin:0;color:var(--bone);padding-right:90px}
.lu-d-common{font-size:15px;color:var(--line);margin:5px 0 0}
.lu-d-common.lu-dk{color:var(--ochre)}
.lu-d-common .lu-dk-src{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.lu-d-authority{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.lu-facts{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(300px,1.2fr);gap:20px;margin-top:24px}
@media (max-width:700px){ .lu-facts{grid-template-columns:1fr} }
.lu-section{background:var(--prussian);border:1px solid rgba(var(--border-rgb),.25);border-radius:4px;padding:16px 18px}
.lu-section h4{margin:0 0 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);font-weight:500}
.lu-section dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.lu-section dt{color:var(--muted);white-space:nowrap}
.lu-section dd{margin:0;color:var(--text)}
.lu-section .lu-note{margin:10px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
.lu-section .lu-src{margin:7px 0 0;font-family:var(--mono);font-size:9.5px;color:var(--line-dim)}
.lu-status{display:inline-block;padding:2px 8px;border-radius:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;border:1px solid var(--line-dim)}
.lu-status.lc{color:var(--st-good);border-color:var(--st-good-b)}
.lu-status.nt,.lu-status.vu{color:var(--ochre);border-color:var(--ochre-dim)}
.lu-status.en,.lu-status.cr{color:var(--st-bad);border-color:var(--st-bad-b)}
.lu-status.dd,.lu-status.na{color:var(--muted)}
.lu-links{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:22px}
.lu-links a{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--line);text-decoration:none;border:0;border-radius:0;
}
.lu-links a:hover{color:var(--ochre)}
.lu-links a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.lu-links svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lu-links .wiki-mark{font:18px/1 Georgia,serif;transform:translateY(-1px)}
.lu-prov{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.55;border-top:1px solid rgba(var(--border-rgb),.18);padding-top:14px}

.wm-pending{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--line-dim);padding:22px 0;text-align:center;
}

.lu-prov a{color:var(--line)}

/* ---------- country browse map ---------- */
.cm-map-wrap{margin-top:0}
.cm-map{position:relative}
.cm-map svg{display:block;width:100%;height:auto;background:var(--map-water);border:1px solid rgba(var(--border-rgb),.22);border-radius:3px;cursor:grab;touch-action:none}
.cm-map svg.dragging{cursor:grabbing}
.cm-zoom-g{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cm-zoom-g.no-anim{transition:none}
.cm-label{
  position:absolute;top:10px;left:10px;z-index:2;pointer-events:none;max-width:calc(100% - 76px);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ochre);background:rgba(var(--abyss-rgb),.85);border:1px solid var(--ochre-dim);
  padding:6px 12px;border-radius:2px;opacity:0;transform:translateY(-4px);
  transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cm-label.show{opacity:1;transform:none}
.cm-zoom-ctrl{position:absolute;top:10px;right:10px;z-index:2;display:flex;flex-direction:column;gap:4px}
.cm-zoom-ctrl button{
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px;line-height:1;
  background:rgba(var(--abyss-rgb),.85);border:1px solid var(--line-dim);color:var(--text);
  border-radius:2px;cursor:pointer;transition:.15s;
}
.cm-zoom-ctrl button:hover{border-color:var(--ochre);color:var(--ochre)}
.cm-zoom-ctrl button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.cm-land{fill:var(--map-land);stroke:none;pointer-events:none}
.cm-c{fill:var(--map-land);stroke:var(--map-water);stroke-width:.4;vector-effect:non-scaling-stroke;transition:fill .12s}
.cm-c.has{fill:var(--map-has);cursor:pointer}
.cm-c.has:hover{fill:var(--map-has-hover)}
.cm-c.range{fill:var(--ochre-dim)}
.cm-c.range:hover{fill:var(--range-hover)}
.cm-c.sel{fill:var(--ochre)}
.cm-c.range.sel{fill:var(--ochre)}
.cm-d{fill:var(--map-dot);stroke:var(--map-water);stroke-width:.8;cursor:pointer;transition:fill .12s}
.cm-d:hover{fill:var(--map-dot-hover)}
.cm-d.range{fill:var(--ochre-dim)}
.cm-d.sel{fill:var(--ochre)}
.cm-d.range.sel{fill:var(--ochre)}
.cm-ring{fill:none;stroke:var(--ochre);stroke-width:1.4;pointer-events:none}
.cm-mode{display:flex;gap:2px;margin:0}
.cm-mode button{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--muted);padding:5px;border-radius:0;cursor:pointer;transition:.15s;
}
.cm-mode button:hover{color:var(--ochre)}
.cm-mode button[aria-pressed="true"]{background:rgba(var(--border2-rgb),.1);color:var(--ochre)}
.cm-mode button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.cm-mode svg{width:16px;height:16px;overflow:visible}
.cm-mode .mode-globe{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.cm-mode .mode-country{fill:currentColor;stroke:none}

@media (max-width:620px){
  /* three rows: title, then the switch (it names what's on screen, so it
     stays with the title rather than sliding down to the search's row),
     then search plus the icon cluster, which fit together at any phone
     width once the switch is out of their way */
  .topbar-in{flex-wrap:wrap;gap:10px 14px}
  .tb-brand{font-size:15px;flex-basis:100%}
  .pageswitch{flex-basis:100%}
  .tb-search{width:auto;margin-left:0;flex:1 1 150px}
  .ps-opt{padding:6px 10px;letter-spacing:.08em}
}

/* ---------- expandable tree ---------- */
.tree-tools{position:absolute;z-index:3;top:8px;right:8px;display:flex;gap:2px;align-items:center;margin:0}
.tree-tools button{
  width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--muted);padding:5px;border-radius:0;cursor:pointer;transition:.15s;
}
.tree-tools button:hover{color:var(--ochre)}
.tree-tools button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.tree-tools .cm-mode button[aria-pressed="true"]{background:rgba(var(--border2-rgb),.1);color:var(--ochre)}
.tree-tools svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
g.trow{cursor:pointer;transition:opacity .25s}
g.trow.dim{opacity:.22}
g.trow.dim:hover{opacity:.5}
g.trow .trow-hit{fill:transparent}
g.trow:hover .trow-hit{fill:rgba(var(--hover-rgb),.07)}
g.trow:focus-visible{outline:none}
g.trow:focus-visible .trow-hit{fill:rgba(var(--ochre-rgb),.15)}
.t-subfam{font-family:var(--display);font-size:17px;font-weight:500;fill:var(--bone);dominant-baseline:middle}
.t-tribe{font-family:var(--mono);font-size:12.5px;letter-spacing:.18em;fill:var(--ochre);dominant-baseline:middle}
.t-genus{font-family:var(--display);font-style:italic;font-size:17px;fill:var(--ink-strong);dominant-baseline:middle}
.t-species{font-family:var(--display);font-style:italic;font-size:16px;fill:var(--ink-mid);dominant-baseline:middle}
.t-note{font-family:var(--body);font-size:14px;fill:var(--ink-faint);dominant-baseline:middle}
.t-count{font-family:var(--mono);font-size:13px;fill:var(--ink-faint);text-anchor:end;dominant-baseline:middle}
.sub-branch{stroke:rgba(var(--border2-rgb),.34);stroke-width:1}
.t-knot{fill:var(--line-dim)}
.t-knot.shut{fill:var(--ochre-dim)}
.t-knot.open{fill:var(--canvas);stroke:var(--ochre);stroke-width:1.5}
.t-knot.leaf{fill:var(--knot-leaf)}
g.tip:hover .t-knot.shut,g.trow:hover .t-knot.shut{fill:var(--ochre)}
g.trow:hover .t-genus,g.trow:hover .t-species,g.trow:hover .t-subfam{fill:var(--ochre)}
g.trow.species.active .t-species{fill:var(--ochre)}
g.trow.species.active .trow-hit{fill:rgba(var(--ochre-rgb),.12)}
g.trow.static{cursor:default}
g.trow.static:hover .trow-hit{fill:none}
g.trow.static:hover .t-genus{fill:var(--ink-strong)}
.fam-open .tip-name{fill:var(--ochre)}

<script>
const themeToggle = document.getElementById('theme-toggle');
const themeMeta = document.querySelector('meta[name="theme-color"]');

function applyTheme(theme, persist = false){
  document.documentElement.dataset.theme = theme;
  themeMeta.content = theme === 'light' ? '#f3f0e5' : '#0d140f';
  const label = `Switch to ${theme === 'light' ? 'dark' : 'light'} mode`;
  themeToggle.setAttribute('aria-label', label);
  themeToggle.title = label;
  themeToggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
  if (persist) {
    try { localStorage.setItem('chiroptera-theme', theme); } catch (_) {}
  }
}

applyTheme(document.documentElement.dataset.theme || 'dark');
themeToggle.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
});

/* =========================================================
   1. FAMILY DATA
   ========================================================= */
const F = {
  Pteropodidae:{common:"Old World fruit bats, flying foxes",genera:46,species:197,range:"Africa, South & SE Asia, Australasia, Pacific islands",
    desc:"The giants. Big forward-facing eyes, a long snout, claws on the second finger, and — almost uniquely among bats — no laryngeal echolocation; they navigate by sight and smell. Only the cave-roosting Rousettus works around this, clicking with its tongue. They are the great pollinators and seed-dispersers of the Old World tropics."},
  Rhinopomatidae:{common:"Mouse-tailed bats",genera:1,species:6,range:"North Africa through the Middle East to India",
    desc:"Named for a long, thin tail left almost entirely free of the membrane, unusual among bats. Desert and dry-country specialists that lay down heavy fat reserves and can go dormant when insects vanish."},
  Craseonycteridae:{common:"Kitti’s hog-nosed bat, bumblebee bat",genera:1,species:1,range:"Limestone caves in western Thailand and southern Myanmar",
    desc:"A family of one. Craseonycteris thonglongyai weighs about two grams, roughly the same as a large bumblebee, which makes it a joint contender for smallest mammal in the world. It has a pig-like snout, no tail, and a very small and fragile range."},
  Megadermatidae:{common:"False vampire bats",genera:6,species:7,range:"Sub-Saharan Africa, South & SE Asia, northern Australia",
    desc:"Big-eared carnivores with a tall nose-leaf and huge ears joined at the base. The name is a libel — they take no blood, but they do take frogs, lizards, birds, rodents and other bats, dropping onto prey from a perch and carrying it off to a feeding roost."},
  Rhinolophidae:{common:"Horseshoe bats",genera:1,species:118,range:"Europe, Africa, Asia, Australasia",
    desc:"Instantly known by the horseshoe-shaped flap of skin around the nostrils, which shapes the beam of sound they emit through the nose. They are the great specialists of echolocation: they hold one long constant frequency and correct for the Doppler shift of their own flight, so that a fluttering insect wing stands out as a rhythm against a steady tone."},
  Hipposideridae:{common:"Old World leaf-nosed bats",genera:7,species:94,range:"Africa, southern Asia to Australia",
    desc:"The horseshoe bats' sister group, with a simpler leaf that lacks the pointed upper lance. Mostly cave-dwellers, often in enormous colonies, and mostly hunters of beetles and moths in cluttered forest."},
  Rhinonycteridae:{common:"Trident bats",genera:4,species:9,range:"Africa, Arabia, Australia",
    desc:"Split off from the leaf-nosed bats in 2014 on genetic evidence. Named for the three-pronged upper part of the nose-leaf. Includes the orange leaf-nosed bat of Australia, which lives so close to its heat and water limits that it is confined to a handful of deep caves."},

  Emballonuridae:{common:"Sheath-tailed and sac-winged bats",genera:14,species:55,range:"Tropics worldwide",
    desc:"The tail pierces the membrane and slides in and out of a sheath as the legs move. Many roost in the open — on tree trunks, in rock crevices, under bridges — rather than deep in caves. Males of several species have a wing pouch that they fill with a fermented perfume and fan at females while singing."},
  Nycteridae:{common:"Slit-faced bats",genera:1,species:14,range:"Africa, Arabia, Malay Peninsula and Java",
    desc:"A deep groove runs down the middle of the face from nose to forehead, hiding a complex nose-leaf inside it. The tail ends in a T-shaped tip of cartilage, found nowhere else in mammals. They glean prey off leaves and the ground rather than catching it in flight."},
  Myzopodidae:{common:"Old World sucker-footed bats",genera:1,species:2,range:"Madagascar only",
    desc:"Two species on one island, with no close living relatives anywhere — an ancient lineage that once ranged across Africa. Pads on the wrists and ankles stick to smooth surfaces, letting them roost head-up inside the still-furled leaf of a traveller’s palm. Where exactly they attach to the rest of the tree is still argued over."},
  Mystacinidae:{common:"New Zealand short-tailed bats",genera:1,species:2,range:"New Zealand",
    desc:"One of only two land mammals native to New Zealand. They fold their wings into leathery sheaths and scramble about on the forest floor and up tree trunks, hunting insects in the leaf litter and drinking nectar from a parasitic ground flower that has come to depend on them. A second species has not been recorded since the 1960s."},
  Thyropteridae:{common:"Disk-winged bats",genera:1,species:5,range:"Southern Mexico to south-eastern Brazil",
    desc:"Suction cups on the thumbs and ankles, strong enough to hold the whole animal on one disk. They roost head-up in the young furled leaf of a Heliconia, which unrolls within a day, so the group moves house constantly and calls to keep itself together."},
  Furipteridae:{common:"Smoky bats",genera:2,species:2,range:"Costa Rica to Peru, Brazil and Trinidad",
    desc:"Tiny, grey and rarely seen. The thumb is almost entirely swallowed by the wing membrane and the face is oddly pug-nosed. They appear to eat moths almost exclusively."},
  Noctilionidae:{common:"Bulldog or fishing bats",genera:1,species:2,range:"Mexico and the Caribbean to northern Argentina",
    desc:"Loose-jowled faces and enormous feet. The greater bulldog bat trawls calm water with hooked claws, detecting the ripples a fish makes when it breaks the surface, then gaffs it and stores it in cheek pouches while it keeps flying."},
  Mormoopidae:{common:"Mustached and ghost-faced bats",genera:2,species:18,range:"Southern USA to Brazil, and the Caribbean",
    desc:"Stiff bristles fringe the lips in a moustache; in ghost-faced bats the ears wrap round to meet across the forehead, hiding the eyes. They form colonies of hundreds of thousands in hot, humid caves and are pure insect hunters."},
  Phyllostomidae:{common:"New World leaf-nosed bats",genera:61,species:231,range:"South-western USA to northern Argentina",
    desc:"The most ecologically varied family of mammals on Earth, split into eleven subfamilies. Within one family you find insect gleaners, fruit eaters, long-tongued nectar feeders that pollinate cacti and agave, carnivores that hunt frogs by their mating calls, and the three vampires. The spear-shaped nose-leaf is the shared badge."},
  Natalidae:{common:"Funnel-eared bats",genera:3,species:11,range:"Northern Mexico and the Caribbean to Brazil",
    desc:"Delicate, long-legged and long-tailed, with funnel-shaped ears and a curious gland on the muzzle of adult males. They fly slowly and with great manoeuvrability deep inside hot caves."},
  Molossidae:{common:"Free-tailed bats",genera:22,species:133,range:"Warm regions worldwide",
    desc:"Built for speed: long narrow wings, a thick tail projecting well past the membrane, leathery wrinkled faces. Mexican free-tailed bats climb to three kilometres and have been clocked faster in level flight than any other bird or bat, and they gather in the largest warm-blooded aggregations known — millions in a single cave."},
  Miniopteridae:{common:"Bent-winged bats",genera:1,species:41,range:"Southern Europe, Africa, Asia, Australia, Pacific",
    desc:"The last joint of the third finger is more than twice the length of the one before it, so the wingtip folds back on itself at rest. Long-distance travellers between summer nursery caves and winter hibernacula. Only recognised as a family of their own in the 2000s."},
  Cistugidae:{common:"Wing-gland bats",genera:1,species:2,range:"South Africa and Namibia",
    desc:"Two small species split from the vesper bats in 2010 after genetics showed they had been separate for tens of millions of years. Named for glands scattered along the wing membrane whose purpose is still unknown. Confined to fynbos and Karoo scrub."},
  Vespertilionidae:{common:"Vesper bats, evening bats",genera:61,species:556,range:"Every continent except Antarctica",
    desc:"A third of all bat species, and the family most people in temperate countries mean when they say 'bat'. Plain-faced, no nose-leaf, insect-eating almost throughout. It includes Myotis, the second-largest genus of mammals, the pipistrelles, the serotines, and the tree-roosting migratory hoary and red bats."}
};

/* =========================================================
   3. CLADOGRAM — expandable to species
   ========================================================= */
const leaf = n => ({name:n, leaf:true});
const clade = (...c) => ({children:c});

const TREE = {name:"Chiroptera", rank:"Order", children:[
  {name:"Yinpterochiroptera", rank:"Suborder", children:[
    {name:"Pteropodoidea", rank:"Superfamily", children:[ leaf("Pteropodidae") ]},
    {name:"Rhinolophoidea", rank:"Superfamily", children:[
      clade( leaf("Megadermatidae"), clade( leaf("Rhinopomatidae"), leaf("Craseonycteridae") ) ),
      clade( leaf("Rhinolophidae"), clade( leaf("Hipposideridae"), leaf("Rhinonycteridae") ) )
    ]}
  ]},
  {name:"Yangochiroptera", rank:"Suborder", children:[
    {name:"Emballonuroidea", rank:"Superfamily", children:[ leaf("Nycteridae"), leaf("Emballonuridae"), leaf("Myzopodidae") ]},
    {name:"Noctilionoidea", rank:"Superfamily", children:[
      clade( leaf("Mystacinidae"),
        clade( leaf("Thyropteridae"),
          clade( leaf("Furipteridae"),
            clade( leaf("Noctilionidae"),
              clade( leaf("Mormoopidae"), leaf("Phyllostomidae") )))))
    ]},
    {name:"Vespertilionoidea", rank:"Superfamily", children:[
      leaf("Natalidae"),
      clade( leaf("Molossidae"),
        clade( leaf("Miniopteridae"),
          clade( leaf("Cistugidae"), leaf("Vespertilionidae") )))
    ]}
  ]}
]};

const SVGNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById('tree');
const VW = 700;                            // viewBox width
const TOP = 4, LEFT = 16, TIPX = 110, COUNTX = VW - 24;
const GAP_SF = 46, GAP_SUB = 88;
const RH = {fam:46, subfam:30, tribe:25, genus:25, species:24};
const STEP2 = 14;                          // one nesting step below the family
const PX = l => TIPX + l*STEP2;            // branch point of a level
const LX = l => PX(l) + 9;                 // where its label starts

function el(tag, attrs, txt){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(txt!=null) e.textContent = txt;
  return e;
}

// depth of every backbone node
let maxDepth = 0;
(function setDepth(n,d){
  n.depth = d; if(d>maxDepth) maxDepth = d;
  if(!n.leaf) n.children.forEach(c=>setDepth(c,d+1));
})(TREE,0);

// structural grouping: one entry per superfamily, in drawing order
const BLOCKS = [];
TREE.children.forEach(sub=>{
  sub.children.forEach((sf,i)=>{
    const members = [];
    (function gather(n){ n.leaf ? members.push(n.name) : n.children.forEach(gather); })(sf);
    BLOCKS.push({ sub: i===0 ? sub.name : null, clade: sub.name, sf: sf.name, members });
  });
});

// lineage lookup for the card
const LINEAGE = {};
(function lwalk(node, path){
  if(node.leaf){ LINEAGE[node.name] = path; return; }
  const p = node.name ? path.concat(node.name) : path;
  node.children.forEach(c=>lwalk(c,p));
})(TREE,[]);

/* ---- taxonomy below each family, built on demand ---- */
const kidCache = {};
function famChildren(fam){
  if(kidCache[fam]) return kidCache[fam];
  const out = [];
  (ATLAS[fam]||[]).forEach((sf, si)=>{
    const tribeNodes = [];
    sf.tribes.forEach((tr, ti)=>{
      const genera = tr.g.map(g=>({
        kind:'genus', name:g[0], n:g[1], fam, key:'g:'+g[0]
      }));
      if(tr.t) tribeNodes.push({kind:'tribe', name:tr.t, fam, children:genera, key:'t:'+fam+'|'+si+'|'+ti});
      else tribeNodes.push(...genera);
    });
    if(sf.sub) out.push({kind:'subfam', name:sf.sub, note:sf.note, fam, children:tribeNodes, key:'s:'+fam+'|'+si});
    else out.push(...tribeNodes);
  });
  return (kidCache[fam] = out);
}
function genusChildren(g){
  const e = SP[g];
  if(!e) return null;
  return e[1].map(s=>({kind:'species', name:g+' '+s[0], note:s[1]||'', key:'x:'+g+' '+s[0]}));
}
function nodeChildren(n){
  return n.kind==='genus' ? genusChildren(n.name) : (n.children||null);
}
function countGenera(list){
  return list.reduce((s,n)=> s + (n.kind==='genus' ? 1 : countGenera(n.children||[])), 0);
}
function countSpecies(list){
  return list.reduce((s,n)=> s + (n.kind==='genus' ? n.n : countSpecies(n.children||[])), 0);
}
/* ---- render: a "tree context" bundles everything one cladogram instance
   needs (its own svg, card, open/selection state and data) so the exact
   same drawing/interaction code can drive several independent trees ---- */
function makeTreeCtx(o){
  return Object.assign({
    open: new Set(), famG: {}, selected: null, selectedSp: null,
    onDrawn: null
  }, o);
}

let mainCtx = null; // set once the main tree is built, at the bottom of this script

let countrySpeciesSet = null; // "Genus species" binomials confirmed in the selected country, or null
let countryLive = null;       // {liveFamilies, live, famCount, genusCount} derived from countrySpeciesSet
let countryTreeMode = 'dim';  // 'dim' (gray out the rest) or 'filter' (show only the live branches)

// walk the full taxonomy once per country selection, marking every family/
// subfamily/tribe/genus/species node that has at least one descendant
// (or is itself) confirmed in the selected country, and tallying how many
// live species sit under each family and genus (used by "show only" mode,
// where the on-screen counts must reflect what's actually shown, not the
// species totals for the whole world)
function computeCountryLiveKeys(speciesSet){
  const live = new Set(), liveFamilies = new Set();
  const famCount = {}, genusCount = {};
  function walk(list){
    let total = 0;
    list.forEach(n=>{
      let count;
      if(n.kind === 'genus'){
        const kids = genusChildren(n.name) || [];
        count = 0;
        kids.forEach(sp=>{ if(speciesSet.has(sp.name)){ live.add(sp.key); count++; } });
        if(count) genusCount[n.name] = count;
      } else {
        count = walk(n.children || []);
      }
      if(count) live.add(n.key);
      total += count;
    });
    return total;
  }
  Object.keys(F).forEach(fam=>{
    const count = walk(famChildren(fam));
    if(count){ liveFamilies.add(fam); famCount[fam] = count; }
  });
  return {live, liveFamilies, famCount, genusCount};
}

// live descendant counts, used only in "show only" mode — mirrors
// countGenera/countSpecies but counts just the surviving species
function liveGeneraCount(list){
  return list.reduce((s,n)=> s + (n.kind==='genus' ? (countryLive.genusCount[n.name]?1:0) : liveGeneraCount(n.children||[])), 0);
}
function liveSpeciesCount(list){
  return list.reduce((s,n)=> s + (n.kind==='genus' ? (countryLive.genusCount[n.name]||0) : liveSpeciesCount(n.children||[])), 0);
}

function applyTreeDim(){
  if(!mainCtx) return;
  Object.keys(mainCtx.famG).forEach(n=>{
    const countryOut = !!countryLive && !countryLive.liveFamilies.has(n);
    mainCtx.famG[n].classList.toggle('dim', countryOut);
  });
  mainCtx.svg.querySelectorAll('g.trow[data-key]').forEach(g=>{
    g.classList.toggle('dim', !!countryLive && !countryLive.live.has(g.dataset.key));
  });
}

// node marker sitting on the branch point
function knot(x, y, state){
  return state === 'open'
    ? el('circle',{class:'t-knot open', cx:x, cy:y, r:3.2})
    : el('circle',{class:'t-knot '+state, cx:x, cy:y, r:state==='leaf'?1.7:2.9});
}

function ctxDrawTree(ctx){
  const svg = ctx.svg;
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  ctx.famG = {};

  // "show only" mode: prune every branch down to what's actually live in the
  // selected country, instead of drawing the full tree and dimming the rest
  const filtering = (ctx === mainCtx) && countryTreeMode === 'filter' && !!countryLive;

  /* ---------- 1. layout ---------- */
  let posY = TOP;
  const rows = [], links = [], famY = {}, headings = [];

  function walk(list, level, parentY){
    const l = filtering ? list.filter(n=>countryLive.live.has(n.key)) : list;
    const bx = PX(level-1), cx = PX(level);
    l.forEach(n=>{
      const h = RH[n.kind];
      const y = posY + h/2;
      rows.push({kind:n.kind, node:n, y, level});
      links.push('M '+bx+' '+parentY+' L '+bx+' '+y+' L '+cx+' '+y);
      posY += h;
      if(ctx.open.has(n.key)){
        const kids = ctx.nodeChildren(n);
        if(kids && kids.length) walk(kids, level+1, y);
      }
    });
  }

  // the suborder heading belongs to whichever block is the first *surviving*
  // one under it — not always the first block in TREE order, since country
  // filtering can knock out that first superfamily while a later one (with
  // live families) still needs the suborder label above it
  let lastCladeShown = null;
  ctx.blocks.forEach(b=>{
    const members = filtering ? b.members.filter(f=>countryLive.liveFamilies.has(f)) : b.members;
    if(!members.length) return;
    const showSub = b.clade !== lastCladeShown;
    if(showSub) lastCladeShown = b.clade;
    posY += showSub ? GAP_SUB : GAP_SF;
    headings.push({b: Object.assign({}, b, {members, sub: showSub ? b.clade : null}), y0: posY + RH.fam/2});
    members.forEach(fam=>{
      const y = posY + RH.fam/2;
      famY[fam] = y;
      rows.push({kind:'fam', name:fam, y, level:0});
      posY += RH.fam;
      if(ctx.open.has('f:'+fam)){
        posY += 2;
        walk(ctx.famChildren(fam), 1, y);
        posY += 8;
      }
    });
  });

  // in "show only" mode the backbone (order > suborder > superfamily > family)
  // needs pruning down to just the live families too, or it'll try to draw
  // branches to families that never got a row (and therefore no Y position)
  function filterTree(node, liveFamilies){
    if(node.leaf) return liveFamilies.has(node.name) ? node : null;
    const kids = node.children.map(c=>filterTree(c, liveFamilies)).filter(Boolean);
    return kids.length ? Object.assign({}, node, {children: kids}) : null;
  }
  const backboneTree = filtering ? filterTree(ctx.tree, countryLive.liveFamilies) : ctx.tree;

  if(backboneTree){
    (function setDepth(n,d){ n.depth=d; if(!n.leaf) n.children.forEach(c=>setDepth(c,d+1)); })(backboneTree, 0);
    (function midY(n){
      if(n.leaf) return (n.y = famY[n.name]);
      n.children.forEach(midY);
      n.y = (n.children[0].y + n.children[n.children.length-1].y)/2;
      return n.y;
    })(backboneTree);
  }

  const H = posY + 22;
  svg.setAttribute('viewBox', `0 0 ${VW} ${H}`);
  svg.appendChild(el('rect',{x:0,y:0,width:VW,height:H,class:'tree-bg'}));

  /* ---------- 2. backbone, then the branches that continue below a family ---------- */
  const STEP = (TIPX - LEFT) / maxDepth;
  const xOf = n => n.leaf ? TIPX : LEFT + n.depth*STEP;
  if(backboneTree) (function draw(node){
    if(node.leaf) return;
    const px = xOf(node);
    node.children.forEach(c=>{
      svg.appendChild(el('path',{d:`M ${px} ${node.y} L ${px} ${c.y} L ${xOf(c)} ${c.y}`, class:'branch'}));
      draw(c);
    });
  })(backboneTree);
  links.forEach(d=> svg.appendChild(el('path',{d, class:'branch sub-branch'})));

  function heading(text, x, y, cls, fs){
    const w = text.length * fs * 0.78 + 16;
    svg.appendChild(el('rect',{class:'knock', x:x-7, y:y-fs-2, width:w, height:fs+9}));
    svg.appendChild(el('text',{x:x, y:y, class:cls}, text));
  }
  headings.forEach(({b,y0})=>{
    if(b.sub){
      heading(b.sub.toUpperCase(), LEFT, y0 - 75, 'sub-label', 16.5);
      svg.appendChild(el('line',{x1:LEFT,y1:y0-64,x2:COUNTX,y2:y0-64,class:'tree-rule','stroke-width':'.8'}));
    }
    const n = b.members.reduce((s,f)=>s+(filtering ? (countryLive.famCount[f]||0) : ctx.famInfo[f].species),0);
    heading(b.sf.toUpperCase(), LEFT+18, y0 - 32, 'sf-label', 13.5);
    const cx = LEFT+18 + b.sf.length*13.5*0.78 + 20;
    svg.appendChild(el('rect',{class:'knock',x:cx-6,y:y0-47,width:150,height:23}));
    svg.appendChild(el('text',{x:cx, y:y0-32, class:'sf-count'},
      b.members.length + (b.members.length===1?' family':' families') + ' · ~' + n + ' spp.'));
  });

  /* ---------- 4. rows ---------- */
  rows.forEach(r=>{
    if(r.kind === 'fam'){
      const d = ctx.famInfo[r.name], isOpen = ctx.open.has('f:'+r.name);
      const famSpecies = filtering ? (countryLive.famCount[r.name]||0) : d.species;
      const g = el('g',{
        class:'tip'+(isOpen?' fam-open':'')+(r.name===ctx.selected?' active':''),
        tabindex:'0', role:'button', 'aria-expanded':isOpen?'true':'false',
        'aria-label':r.name+' — '+d.common+', '+famSpecies+' species'
      });
      g.appendChild(el('rect',{class:'focus-ring',x:PX(0)-5,y:r.y-21,width:COUNTX-PX(0)+13,height:42,rx:2}));
      g.appendChild(el('rect',{class:'tip-hit',x:PX(0)-5,y:r.y-21,width:COUNTX-PX(0)+13,height:42}));
      g.appendChild(knot(PX(0), r.y, isOpen ? 'open' : 'shut'));
      g.appendChild(el('text',{class:'tip-name',x:LX(0),y:r.y-9}, r.name));
      g.appendChild(el('text',{class:'tip-common',x:LX(0),y:r.y+13}, d.common));
      g.appendChild(el('text',{class:'tip-count',x:COUNTX,y:r.y}, famSpecies===1?'1':'~'+famSpecies));
      const hit = ()=>ctxToggleFamily(ctx, r.name);
      g.addEventListener('click', hit);
      g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();hit();} });
      svg.appendChild(g);
      ctx.famG[r.name] = g;
      return;
    }

    const n = r.node, x = PX(r.level), lx = LX(r.level);
    const rawKids = ctx.nodeChildren(n) || [];
    const expandable = filtering ? rawKids.some(k=>countryLive.live.has(k.key)) : !!rawKids.length;
    const open = ctx.open.has(n.key);
    const g = el('g',{class:'trow'+(open?' open':'')+(expandable?'':' static'), tabindex:'0', role:'button', 'data-key':n.key});
    g.appendChild(el('rect',{class:'trow-hit', x:x-5, y:r.y-12, width:COUNTX-x+13, height:24}));
    g.appendChild(knot(x, r.y, expandable ? (open?'open':'shut') : 'leaf'));
    if(expandable) g.setAttribute('aria-expanded', open?'true':'false');
    else { g.removeAttribute('tabindex'); g.removeAttribute('role'); }

    if(r.kind === 'subfam' || r.kind === 'tribe'){
      const kids = n.children;
      const genCount = filtering ? liveGeneraCount(kids) : countGenera(kids);
      const spCount = filtering ? liveSpeciesCount(kids) : countSpecies(kids);
      g.setAttribute('aria-label', (r.kind==='subfam'?'Subfamily ':'Tribe ')+n.name);
      g.appendChild(el('text',{class:r.kind==='subfam'?'t-subfam':'t-tribe',x:lx,y:r.y},
        r.kind==='subfam' ? n.name : n.name.toUpperCase()));
      g.appendChild(el('text',{class:'t-count',x:COUNTX,y:r.y}, genCount+' genera · ~'+spCount+' spp.'));
      ctxBindToggle(ctx, g, n);
    } else if(r.kind === 'genus'){
      const liveN = filtering ? (countryLive.genusCount[n.name]||0) : n.n;
      g.setAttribute('aria-label', 'Genus '+n.name+', '+liveN+' species');
      g.appendChild(el('text',{class:'t-genus',x:lx,y:r.y}, n.name));
      g.appendChild(el('text',{class:'t-count',x:COUNTX,y:r.y}, liveN===1?'1 species':liveN+' spp.'));
      if(expandable) ctxBindToggle(ctx, g, n);
    } else {
      g.setAttribute('class','trow species'+(n.name===ctx.selectedSp?' active':''));
      g.setAttribute('tabindex','0'); g.setAttribute('role','button');
      g.setAttribute('aria-label', n.name+(n.note?' — '+n.note:''));
      const t = el('text',{x:lx,y:r.y,'dominant-baseline':'middle'});
      t.appendChild(el('tspan',{class:'t-species'}, n.name));
      if(n.note) t.appendChild(el('tspan',{class:'t-note',dx:'11'}, n.note));
      g.appendChild(t);
      const pick = ()=>ctxShowSpecies(ctx, n.name);
      g.addEventListener('click', pick);
      g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();} });
    }
    svg.appendChild(g);
  });

  if(ctx.onDrawn) ctx.onDrawn();
}

function ctxBindToggle(ctx, g, n){
  const t = ()=>{ ctxToggle(ctx, n.key); };
  g.addEventListener('click', t);
  g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();t();} });
}
function ctxToggle(ctx, key){
  ctx.open.has(key) ? ctx.open.delete(key) : ctx.open.add(key);
  ctxDrawTree(ctx);
}
function ctxToggleFamily(ctx, name){
  const key = 'f:'+name, wasOpen = ctx.open.has(key);
  wasOpen ? ctx.open.delete(key) : ctx.open.add(key);
  ctx.selected = name; ctx.selectedSp = null;
  ctxDrawTree(ctx);
  ctxSelect(ctx, name);
  if(!wasOpen) ctxScrollFamIntoView(ctx, name);
}
function ctxScrollFamIntoView(ctx, name){
  const g = ctx.famG[name];
  const tip = g && g.querySelector('.tip-name');
  if(!tip) return;
  tip.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

function ctxCardReset(ctx){
  ctx.selected = null; ctx.selectedSp = null;
  ctx.card.classList.add('empty');
  ctx.card.innerHTML = ctx.emptyHTML;
  if(ctx === mainCtx) cmShowSpeciesRange(null);
}

function ctxSelect(ctx, name){
  ctx.selected = name; ctx.selectedSp = null;
  if(ctx === mainCtx) cmShowSpeciesRange(null);
  ctx.card.classList.remove('empty');
  Object.keys(ctx.famG).forEach(n=>ctx.famG[n].classList.toggle('active', n===name));
  ctx.svg.querySelectorAll('g.trow.species.active').forEach(g=>g.classList.remove('active'));
  const d = F[name];
  const stats = ctx.famInfo[name];
  const isOpen = ctx.open.has('f:'+name);
  ctx.card.innerHTML =
    '<p class="card-lineage">'+LINEAGE[name].join(' &rsaquo; ')+' &rsaquo; '+name+'</p>'+
    '<div class="name-row"><h3>'+name+'</h3><span class="common">'+d.common+'</span></div>'+
    '<p class="desc">'+d.desc+'</p>'+
    '<div class="chips">'+
      '<span class="chip"><b>'+stats.genera+'</b> '+(stats.genera===1?'genus':'genera')+'</span>'+
      '<span class="chip"><b>'+(stats.species===1?'1':'~'+stats.species)+'</b> '+(stats.species===1?'species':'spp.')+'</span>'+
    '</div>'+
    '<p class="range-line">Range: <b>'+d.range+'</b></p>'+
    '<button type="button" class="jump" data-fam="'+name+'">'+
      (isOpen ? 'Close this branch' : 'Open '+name+' in the tree')+' &rarr;</button>';
}

/* locate a genus within the ATLAS: which subfamily/tribe it hangs under */
function findGenusPath(family, genus){
  const subs = ATLAS[family];
  if(!subs) return null;
  for(let si=0; si<subs.length; si++){
    const sf = subs[si];
    for(let ti=0; ti<sf.tribes.length; ti++){
      const tr = sf.tribes[ti];
      if(tr.g.some(g=>g[0]===genus)) return {family, si, ti, hasSub: !!sf.sub, hasTribe: !!tr.t};
    }
  }
  return null;
}

/* scroll an arbitrary tree row into view on the page */
function scrollRowIntoView(g){
  const rect = g && g.querySelector('rect');
  if(!rect) return;
  rect.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

/* open the main tree's family/subfamily/tribe/genus branch down to one
   species and select it (used by search results, which always jump to
   the main tree regardless of which cladogram triggered the search) */
function openTreeToSpecies(family, genus, binomial, focusCard = false){
  const path = findGenusPath(family, genus);
  if(!path) return false;
  mainCtx.open.add('f:'+family);
  if(path.hasSub) mainCtx.open.add('s:'+family+'|'+path.si);
  if(path.hasTribe) mainCtx.open.add('t:'+family+'|'+path.si+'|'+path.ti);
  mainCtx.open.add('g:'+genus);
  ctxDrawTree(mainCtx);
  ctxShowSpecies(mainCtx, binomial);
  if(focusCard){
    mainCtx.card.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  } else {
    scrollRowIntoView(document.querySelector('g.trow.species.active'));
  }
  return true;
}

/* a species picked in any cladogram fills that instance's own panel */
function ctxShowSpecies(ctx, binomial){
  ctx.selectedSp = binomial; ctx.selected = null;
  ctx.card.classList.remove('empty');
  Object.keys(ctx.famG).forEach(n=>ctx.famG[n].classList.remove('active'));
  ctx.svg.querySelectorAll('g.trow.species').forEach(g=>{
    g.classList.toggle('active', g.getAttribute('aria-label').indexOf(binomial) === 0);
  });
  ctx.card.innerHTML = luSpeciesHTML(binomial, true);
  const species = luState.byName[binomial.toLowerCase()];
  loadLocalPhoto(species && luState.media[species.id], ctx.card.querySelector('.inat-photo'));
  if(ctx === mainCtx) cmShowSpeciesRange(binomial);
  if(ctx.card.getBoundingClientRect().top < 0 || ctx.card.getBoundingClientRect().top > innerHeight-120){
    ctx.card.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
  }
}

/* =========================================================
   4. THE ATLAS — every family, subfamily, tribe and genus
   Structure: [subfamily, note, tribes] where a tribe is
   [tribe name or null, [[genus, species], ...]]
   ========================================================= */
const S = (sub,note,tribes)=>({sub,note,tribes});
const T = (t,g)=>({t,g});
const G = g => [T(null,g)];              // no tribes used
const P = g => [S(null,null,G(g))];      // no subfamilies used

const ATLAS = {
Pteropodidae:[
  S("Eidolinae","Africa’s great migrants. Up to ten million gather in one Zambian swamp forest each November — the largest mammal migration known.",
    G([["Eidolon",2]])),
  S("Epomophorinae","African and Asian fruit and nectar bats, including the only pteropodids that echolocate.",[
    T("Rousettini",[["Rousettus",7]]),
    T("Stenonycterini",[["Stenonycteris",1]]),
    T("Eonycterini",[["Eonycteris",3]]),
    T("Myonycterini",[["Myonycteris",5],["Megaloglossus",2]]),
    T("Plerotini",[["Plerotes",1]]),
    T("Scotonycterini",[["Scotonycteris",3],["Casinycteris",3]]),
    T("Epomophorini",[["Epomophorus",11],["Epomops",2],["Hypsignathus",1],["Nanonycteris",1]]),
    T(null,[["Pilonycteris",1]])
  ]),
  S("Harpyionycterinae","Bare-backed fruit bats, whose wings meet along the spine so the back looks naked.",[
    T("Dobsoniini",[["Dobsonia",14],["Aproteles",1]]),
    T("Harpyionycterini",[["Harpyionycteris",2],["Boneia",1]])
  ]),
  S("Cynopterinae","Small short-faced fruit bats of South and South-East Asia. Several bite leaf ribs until the leaf folds into a tent to roost under.",[
    T("Cynopterini",[["Cynopterus",7],["Megaerops",4],["Ptenochirus",3]]),
    T("Balionycterini",[["Dyacopterus",3],["Thoopterus",2],["Balionycteris",2],["Aethalops",2],["Penthetor",1],["Chironax",2],["Sphaerias",1],["Alionycteris",1],["Haplonycteris",1],["Otopteropus",1],["Latidens",1]])
  ]),
  S("Macroglossusinae","Blossom bats — tiny, with a long brush-tipped tongue for nectar.",
    G([["Syconycteris",3],["Macroglossus",2]])),
  S("Notopterisinae","Long-tailed fruit bats of Fiji, Vanuatu and New Caledonia. The only pteropodids with a real tail.",
    G([["Notopteris",2]])),
  S("Nyctimeninae","Tube-nosed fruit bats: nostrils on separate stalks, wings spotted yellow-green like lichen.",
    G([["Nyctimene",16],["Paranyctimene",2]])),
  S("Pteropodinae","The flying foxes and their island relatives — the largest bats that have ever lived.",[
    T("Pteropodini",[["Pteropus",65],["Acerodon",5],["Styloctenium",2],["Neopteryx",1]]),
    T("Pteralopini",[["Pteralopex",5],["Desmalopex",2],["Mirimiri",1]]),
    T("Melonycterini",[["Melonycteris",1],["Nesonycteris",4]])
