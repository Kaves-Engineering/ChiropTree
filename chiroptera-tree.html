   (namespaced lu* to avoid collisions with the page code above)
   ========================================================= */
const luState = { species: [], byName:{}, echo: null, danish: {}, media: {}, filtered: [], active: null, ready:false };
const luInput   = document.getElementById('lu-search');
const luResults = document.getElementById('lu-results');
const luDrawer  = document.getElementById('lu-drawer');
const luScrim   = document.getElementById('lu-scrim');
const luDetail  = document.getElementById('lu-detail');
const randomBat = document.getElementById('random-bat');
const LU_MAX = 40;

let queuedRandomBat = null;
function chooseRandomBat(){
  if(!luState.ready || !luState.species.length) return null;
  let species;
  do {
    species = luState.species[Math.floor(Math.random() * luState.species.length)];
  } while(luState.species.length > 1 && species.id === luState.active);
  return species;
}
function preloadRandomBat(){
  if(!queuedRandomBat || queuedRandomBat.id === luState.active) queuedRandomBat = chooseRandomBat();
}
randomBat.addEventListener('pointerenter', preloadRandomBat);
randomBat.addEventListener('pointerdown', preloadRandomBat);
randomBat.addEventListener('focus', preloadRandomBat);
randomBat.addEventListener('click', ()=>{
  preloadRandomBat();
  const species = queuedRandomBat;
  queuedRandomBat = null;
  if(!species) return;
  luSelectSpecies(species.id, true);
});

/* Data is bundled into this page by build.sh (see the JSON blocks at the end of
   the document). Opened straight from the working copy those blocks are empty
   and we fall back to fetching the files next to the page. */
const domReady = () => document.readyState === 'loading'
  ? new Promise(r=>document.addEventListener('DOMContentLoaded', r, {once:true}))
  : Promise.resolve();

function bundled(id, url){
  // the blocks sit at the end of the document, so wait for the parser to reach
  // them before looking; only then is falling back to fetch() meaningful
  return domReady().then(()=>{
    const el = document.getElementById(id);
    const txt = el ? el.textContent.trim() : '';
    if(txt.charAt(0) === '{' || txt.charAt(0) === '[') return JSON.parse(txt);
    return fetch(url, {cache: 'no-cache'}).then(r=>{
      if(!r.ok) throw new Error(url + ' — HTTP ' + r.status);
      return r.json();
    });
  });
}

// data/build_country_distribution.py adds countries GBIF has real occurrence
// records for but MDD's own countryDistribution column omits (see its
// docstring). MDD's column is a checklist that lags the records: without this
// it misses 4 of Denmark's 17 established bat species. Additive only -- it
// never removes or overrides a country MDD does assert.
function luMergeCountrySupplement(species, supplement){
  if(!supplement) return;
  species.forEach(s=>{
    const extra = supplement[s.sciName];
    if(!extra || !extra.length) return;
    const existing = new Set((s.countryDistribution||'').split('|')
      .map(x=>x.trim().replace(/\?$/,'').toLowerCase()).filter(Boolean));
    const add = extra.filter(c=>!existing.has(c.toLowerCase()));
    if(!add.length) return;
    s.countryDistribution = (s.countryDistribution && s.countryDistribution!=='NA')
      ? s.countryDistribution + '|' + add.join('|')
      : add.join('|');
  });
}

Promise.all([
  bundled('d-taxonomy', 'data/chiroptera_taxonomy.json'),
  bundled('d-echo', 'data/echolocation_reference.json'),
  bundled('d-danish', 'data/danish_names.json'),
  bundled('d-countries', 'data/gbif_country_supplement.json'),
  bundled('d-media', 'data/media-manifest.json')
]).then(([tax, echo, danish, countrySupp, media])=>{
  luState.species = tax.species;
  luState.echo = echo;
  luState.danish = danish;
  luState.media = media.assets || {};
  luMergeCountrySupplement(luState.species, countrySupp);
  luState.meta = tax._meta;
  luState.ready = true;
  randomBat.disabled = false;
  luState.species.forEach(s=>{ luState.byName[luNiceName(s.sciName).toLowerCase()] = s; });
  luInput.placeholder = 'Search ' + tax._meta.speciesCount.toLocaleString() + ' bats…';
  if(luInput.value.trim()) luApplyFilter();
  cmMaybeInit();
}).catch(err=>{
  luState.error = err.message;
});

/* ---- world map: outlines built by data/build_world_map.py ---- */
let WMAP = null, WMBASE = null;
bundled('d-worldmap', 'data/world_map.json').then(m=>{
  WMAP = m;
  WMBASE = Object.keys(m.shapes).map(k=>[k, m.shapes[k]]);
  cmMaybeInit();
}).catch(()=>{ WMAP = false; cmMaybeInit(); });

function wmNorm(x){
  return x.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
          .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}

// "Angola|Benin?|..." -> what to paint
function wmResolve(list){
  const shapes = {}, dots = {};
  let named = 0, unmatched = 0;
  (list||'').split('|').forEach(raw=>{
    const t = raw.trim();
    if(!t || t==='NA') return;
    named++;
    const maybe = t.endsWith('?');
    const key = WMAP.index[wmNorm(maybe ? t.slice(0,-1) : t)];
    if(!key){ unmatched++; return; }
    const bag = key.indexOf('d:')===0 ? dots : shapes;
    // true means every record for this place was flagged uncertain
    bag[key] = (key in bag) ? (bag[key] && maybe) : maybe;
  });
  return {shapes, dots, named, unmatched};
}

/* ---- browse-by-country map: click a country, list bats confirmed there ---- */
let CM = null, cmReady = false, cmSelected = null;

function cmBuildIndex(){
  const byKey = {};
  luState.species.forEach(s=>{
    (s.countryDistribution||'').split('|').forEach(raw=>{
      const t = raw.trim();
      if(!t || t==='NA') return;
      const maybe = t.endsWith('?');
      const name = maybe ? t.slice(0,-1).trim() : t;
      if(!name) return;
      const key = WMAP.index[wmNorm(name)];
      if(!key) return;
      let e = byKey[key];
      if(!e) e = byKey[key] = { confirmed:[], maybe:[], name: key.indexOf('d:')===0 ? key.slice(2) : name };
      if(maybe) e.maybe.push(s); else e.confirmed.push(s);
    });
  });
  CM = byKey;
}

// the full range (shapes+dots) of whichever species is currently open in the
// detail card, or null — painted on the main map in a second shade of yellow
let speciesRange = null;

// picking a species anywhere in the main tree (or the country list) paints
// its full range on the map above, in a second shade of yellow; picking a
// family, or clearing the card, turns that back off
function cmShowSpeciesRange(binomial){
  const s = binomial ? luState.byName[binomial.toLowerCase()] : null;
  speciesRange = (s && WMAP) ? wmResolve(s.countryDistribution||'') : null;
  if(cmReady) cmRenderMap();
}

function cmRenderMap(){
  const mapEl = document.getElementById('cm-map-svg');
  if(!mapEl) return;
  let body = '<rect x="0" y="0" width="'+WMAP.w+'" height="'+WMAP.h+'" class="cm-bg"/>';
  // dissolved land mass, under the countries: fills the sub-pixel slivers that
  // independent per-country simplification leaves along shared borders
  if(WMAP.land) body += '<path class="cm-land" d="'+WMAP.land+'"/>';
  body += WMBASE.map(([k,d])=>{
    const e = CM[k];
    const has = e && (e.confirmed.length || e.maybe.length);
    const inRange = speciesRange && (k in speciesRange.shapes);
    const cls = 'cm-c'+(has?' has':'')+(inRange?' range':'')+(k===cmSelected?' sel':'');
    const label = e ? e.name+' — '+e.confirmed.length+' species'+(e.maybe.length?', '+e.maybe.length+' uncertain':'') : '';
    return '<path class="'+cls+'" data-key="'+luEsc(k)+'" d="'+d+'">'+(label?'<title>'+luEsc(label)+'</title>':'')+'</path>';
  }).join('');
  if(cmSelected && WMAP.small.indexOf(cmSelected) >= 0){
    const c = WMAP.cent[cmSelected];
    if(c) body += '<circle class="cm-ring" cx="'+c[0]+'" cy="'+c[1]+'" r="5"/>';
  }
  Object.keys(WMAP.dots).forEach(k=>{
    const e = CM[k];
    const inRange = speciesRange && (k in speciesRange.dots);
    if(!(e && (e.confirmed.length || e.maybe.length)) && !inRange) return;
    const c = WMAP.dots[k];
    if(!c) return;
    const cls = 'cm-d'+(inRange?' range':'')+(k===cmSelected?' sel':'');
    const label = e ? e.name+' — '+e.confirmed.length+' species'+(e.maybe.length?', '+e.maybe.length+' uncertain':'') : '';
    body += '<circle class="'+cls+'" data-key="'+luEsc(k)+'" cx="'+c[0]+'" cy="'+c[1]+'" r="3">'+(label?'<title>'+luEsc(label)+'</title>':'')+'</circle>';
  });
  mapEl.innerHTML = '<svg viewBox="0 0 '+WMAP.w+' '+WMAP.h+'" role="img" aria-label="World map, click a country to filter the tree">'+
    '<g class="cm-zoom-g" id="cm-zoom-g">'+body+'</g></svg>';
  cmApplyView(true);
  cmUpdateLabel();
}

/* ---- pan / zoom: a transform on the <g> wrapping the map's own content,
   reapplied after every cmRenderMap() rebuild so a redraw (new country
   selected, a species range painted) doesn't reset the current view ---- */
let cmView = {scale:1, x:0, y:0};
let cmDrag = null; // {startClientX, startClientY, startX, startY} while a pointer is down
const CM_MIN_SCALE = 1, CM_MAX_SCALE = 12;

function cmClampView(v){
  const scale = Math.min(CM_MAX_SCALE, Math.max(CM_MIN_SCALE, v.scale));
  // keep at least a sliver of the map on-screen at any pan position
  const maxX = WMAP.w * 0.9, maxY = WMAP.h * 0.9;
  const minX = WMAP.w*(1-scale) - WMAP.w*0.9, minY = WMAP.h*(1-scale) - WMAP.h*0.9;
  return { scale, x: Math.min(maxX, Math.max(minX, v.x)), y: Math.min(maxY, Math.max(minY, v.y)) };
}

function cmApplyView(noAnim){
  const g = document.getElementById('cm-zoom-g');
  if(!g) return;
  g.classList.toggle('no-anim', !!noAnim);
  g.setAttribute('transform', 'translate('+cmView.x+' '+cmView.y+') scale('+cmView.scale+')');
}

function cmSetView(v, animate){
  cmView = cmClampView(v);
  cmApplyView(!animate);
}

function cmResetView(animate){ cmSetView({scale:1, x:0, y:0}, animate); }

// point a screen (client) coordinate to viewBox units, independent of how
// the svg itself is currently scaled on the page
function cmClientToViewBox(clientX, clientY){
  const svg = document.querySelector('#cm-map-svg svg');
  if(!svg) return null;
  const rect = svg.getBoundingClientRect();
  if(!rect.width || !rect.height) return null;
  return {
    x: (clientX - rect.left) / rect.width * WMAP.w,
    y: (clientY - rect.top) / rect.height * WMAP.h
  };
}

function cmZoomAt(vx, vy, factor){
  const newScale = Math.min(CM_MAX_SCALE, Math.max(CM_MIN_SCALE, cmView.scale * factor));
  const x = vx - (vx - cmView.x) / cmView.scale * newScale;
  const y = vy - (vy - cmView.y) / cmView.scale * newScale;
  cmSetView({scale:newScale, x, y}, false);
}

// centre the view on a country's centroid at a fixed, comfortable zoom level
function cmZoomToCountry(key){
  const isDot = key.indexOf('d:') === 0;
  const c = isDot ? WMAP.dots[key] : WMAP.cent[key];
  if(!c) return;
  const scale = isDot || WMAP.small.indexOf(key) >= 0 ? 7 : 3;
  cmSetView({ scale, x: WMAP.w/2 - scale*c[0], y: WMAP.h/2 - scale*c[1] }, true);
}

function cmUpdateLabel(){
  const label = document.getElementById('cm-label');
  if(!label) return;
  const e = cmSelected && CM[cmSelected];
  label.textContent = e ? e.name : '';
  label.classList.toggle('show', !!e);
  cmUpdateCountryIcon();
}

function cmUpdateCountryIcon(){
  const icon = document.getElementById('cm-country-icon');
  const button = document.getElementById('cm-mode-filter');
  if(!icon || !button) return;
  const entry = cmSelected && CM[cmSelected];
  const shape = document.querySelector('#cm-map-svg .cm-c.sel');
  if(shape){
    const box = shape.getBBox();
    const pad = Math.max(box.width, box.height) * .08;
    icon.setAttribute('viewBox', [box.x-pad,box.y-pad,box.width+pad*2,box.height+pad*2].join(' '));
    icon.innerHTML = '<path d="'+luEsc(shape.getAttribute('d'))+'"/>';
  } else {
    icon.setAttribute('viewBox','0 0 24 24');
    icon.innerHTML = '<path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 4.5A2.5 2.5 0 1 1 12 11a2.5 2.5 0 0 1 0-4.5Z"/>';
  }
  const text = entry ? 'Show only bats from '+entry.name : 'Show only bats from the selected country';
  button.setAttribute('aria-label', text);
  button.title = text;
}

function cmWireZoomControls(){
  const mapEl = document.getElementById('cm-map');
  if(!mapEl) return;
  mapEl.addEventListener('wheel', e=>{
    e.preventDefault();
    const p = cmClientToViewBox(e.clientX, e.clientY);
    if(!p) return;
    cmZoomAt(p.x, p.y, e.deltaY < 0 ? 1.35 : 1/1.35);
  }, {passive:false});

  mapEl.addEventListener('pointerdown', e=>{
    if(e.target.closest('.cm-zoom-ctrl')) return;
    const svg = document.querySelector('#cm-map-svg svg');
    if(!svg) return;
    cmDrag = {id:e.pointerId, svg, startClientX:e.clientX, startClientY:e.clientY, startX:cmView.x, startY:cmView.y, moved:false};
    // pointer capture is NOT taken here: capturing on pointerdown retargets
    // the pointerup/mouseup/click that follow to the capturing element even
    // for a plain click with zero movement (verified in Chromium — the up
    // and click events come back targeted at the <svg> root, never at the
    // country <path>/<circle> underneath), which silently breaks selecting a
    // country. Capture only gets taken once movement past the drag
    // threshold is confirmed, in pointermove below — a real click never
    // reaches that point, so it's never captured and resolves normally.
  });
  mapEl.addEventListener('pointermove', e=>{
    if(!cmDrag || e.pointerId !== cmDrag.id) return;
    const svg = cmDrag.svg;
    const rect = svg.getBoundingClientRect();
    if(!rect.width) return;
    // "did this become a drag" is judged in real screen pixels, not viewBox
    // units — the map can render anywhere from ~300px to 900px wide, so a
    // fixed viewBox-unit threshold could be under a single screen pixel and
    // flag ordinary mouse-hand jitter on a plain click as a drag
    if(!cmDrag.moved && (Math.abs(e.clientX-cmDrag.startClientX) > 4 || Math.abs(e.clientY-cmDrag.startClientY) > 4)){
      cmDrag.moved = true;
      svg.setPointerCapture(cmDrag.id);
      svg.classList.add('dragging');
    }
    if(!cmDrag.moved) return;
    const dx = (e.clientX - cmDrag.startClientX) / rect.width * WMAP.w;
    const dy = (e.clientY - cmDrag.startClientY) / rect.height * WMAP.h;
    cmSetView({scale:cmView.scale, x:cmDrag.startX+dx, y:cmDrag.startY+dy}, false);
  });
  function endDrag(e){
    if(!cmDrag || e.pointerId !== cmDrag.id) return;
    const svg = cmDrag.svg;
    if(cmDrag.moved){
      svg.classList.remove('dragging');
      if(svg.hasPointerCapture(cmDrag.id)) svg.releasePointerCapture(cmDrag.id);
      // a drag that actually moved the map shouldn't also register as a
      // click on whatever country happens to be under the pointer when it lifts
      cmSuppressNextClick = true;
    }
    cmDrag = null;
  }
  mapEl.addEventListener('pointerup', endDrag);
  mapEl.addEventListener('pointercancel', endDrag);

  document.getElementById('cm-zoom-in').addEventListener('click', ()=>cmZoomAt(WMAP.w/2, WMAP.h/2, 1.6));
  document.getElementById('cm-zoom-out').addEventListener('click', ()=>cmZoomAt(WMAP.w/2, WMAP.h/2, 1/1.6));
  document.getElementById('cm-zoom-reset').addEventListener('click', ()=>cmResetView(true));
}
let cmSuppressNextClick = false;

function cmOnMapClick(e){
  if(cmSuppressNextClick){ cmSuppressNextClick = false; return; }
  const el = e.target.closest('[data-key]');
  if(!el) return;
  const key = el.getAttribute('data-key');
  const entry = CM[key];
  if(!entry || (!entry.confirmed.length && !entry.maybe.length)) return;
  cmSelected = (cmSelected === key) ? null : key;
  cmRenderMap();
  applyCountryFilterToMainTree();
  if(cmSelected) cmZoomToCountry(cmSelected); else cmResetView(true);
}

function applyCountryFilterToMainTree(){
  if(!cmSelected){
    countrySpeciesSet = null; countryLive = null;
  } else {
    const e = CM[cmSelected];
    countrySpeciesSet = new Set((e ? e.confirmed : []).map(s=>luNiceName(s.sciName)));
    countryLive = computeCountryLiveKeys(countrySpeciesSet);
  }
  // a full redraw is needed (not just re-toggling the dim class): in "show
  // only" mode, which rows exist at all depends on the country selection
  ctxDrawTree(mainCtx);
}

function setCountryTreeMode(mode){
  if(countryTreeMode === mode) return;
  countryTreeMode = mode;
  document.getElementById('cm-mode-dim').setAttribute('aria-pressed', mode==='dim' ? 'true' : 'false');
  document.getElementById('cm-mode-filter').setAttribute('aria-pressed', mode==='filter' ? 'true' : 'false');
  ctxDrawTree(mainCtx);
}
document.getElementById('cm-mode-dim').addEventListener('click', ()=>setCountryTreeMode('dim'));
document.getElementById('cm-mode-filter').addEventListener('click', ()=>setCountryTreeMode('filter'));

function cmMaybeInit(){
  if(cmReady || !luState.ready || WMAP===null) return;
  cmReady = true;
  const mapEl = document.getElementById('cm-map');
  const svgHolder = document.getElementById('cm-map-svg');
  if(!mapEl || !svgHolder) return;
  if(WMAP === false){
    svgHolder.innerHTML = '<div class="wm-pending">Map data failed to load.</div>';
    return;
  }
  cmBuildIndex();
  cmRenderMap();
  mapEl.addEventListener('click', cmOnMapClick);
  cmWireZoomControls();
}

function luNiceName(sci){ return sci.replace('_',' '); }
function luEsc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function luApplyFilter(){
  const q = luInput.value.trim().toLowerCase();
  if(!q){ luCloseResults(); return; }
  if(!luState.ready){
    luResults.innerHTML = '<div class="lu-none">'+(luState.error ? 'Could not load the taxonomy: '+luEsc(luState.error) : 'Loading the taxonomy…')+'</div>';
    luOpenResults();
    return;
  }
  luState.filtered = luState.species.filter(s=>{
    const dk = luState.danish[s.sciName];
    return (
      s.sciName.toLowerCase().replace('_',' ').includes(q) ||
      (s.mainCommonName||'').toLowerCase().includes(q) ||
      (s.otherCommonNames||'').toLowerCase().includes(q) ||
      s.genus.toLowerCase().includes(q) ||
      s.family.toLowerCase().includes(q) ||
      (dk && dk.allNames.some(n=>n.toLowerCase().includes(q)))
    );
  });
  luRenderResults();
  luOpenResults();
}

function luRenderResults(){
  const list = luState.filtered;
  if(!list.length){
    luResults.innerHTML = '<div class="lu-none">Nothing matches that. Try a genus, a family or a common name.</div>';
    return;
  }
  const shown = list.slice(0, LU_MAX);
  let html = '<div class="lu-count">'+list.length+' match'+(list.length===1?'':'es')+
             (list.length>LU_MAX ? ' — first '+LU_MAX+' shown' : '')+'</div>';
  html += shown.map(s=>{
    const dk = luState.danish[s.sciName];
    return '<div class="lu-row" role="option" tabindex="0" data-id="'+luEsc(s.id)+'">'+
      '<span class="lu-sci">'+luEsc(luNiceName(s.sciName))+'</span>'+
      (s.mainCommonName ? '<span class="lu-common">'+luEsc(s.mainCommonName)+'</span>' : '')+
      (dk ? '<span class="lu-common lu-dk">🇩🇰 '+luEsc(dk.name)+'</span>' : '')+
      '<span class="lu-fam">'+luEsc(s.family)+' · '+luEsc(s.genus)+'</span></div>';
  }).join('');
  if(luState.meta) html += '<div class="lu-foot">'+luEsc(luState.meta.source)+' — '+
    luState.meta.speciesCount+' species, '+luState.meta.genusCount+' genera, '+luState.meta.familyCount+' families</div>';
  luResults.innerHTML = html;
}

function luOpenResults(){ luResults.hidden = false; luInput.setAttribute('aria-expanded','true'); }
function luCloseResults(){ luResults.hidden = true; luInput.setAttribute('aria-expanded','false'); }

luResults.addEventListener('click', e=>{
  const row = e.target.closest('.lu-row');
  if(row) luSelectSpecies(row.dataset.id);
});
luResults.addEventListener('keydown', e=>{
  const row = e.target.closest('.lu-row');
  if(row && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); luSelectSpecies(row.dataset.id); }
});
luInput.addEventListener('input', luApplyFilter);
luInput.addEventListener('focus', ()=>{ if(luInput.value.trim()) luApplyFilter(); });
luInput.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ luCloseResults(); luInput.blur(); }
  if(e.key==='ArrowDown'){
    const first = luResults.querySelector('.lu-row');
    if(first){ e.preventDefault(); first.focus(); }
  }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.tb-search')) luCloseResults();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ luCloseDrawer(); luCloseResults(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!typing && (e.key==='/' || ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'))){
    e.preventDefault(); luInput.focus(); luInput.select();
  }
});

let luDrawerReturnFocus = null;
function luDrawerTrap(e){
  if(e.key !== 'Tab') return;
  const focusable = luDrawer.querySelectorAll('a[href],button:not([disabled]),input,[tabindex]:not([tabindex="-1"])');
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function luOpenDrawer(){
  luDrawerReturnFocus = document.activeElement;
  luDrawer.classList.add('open'); luScrim.classList.add('open');
  luDrawer.setAttribute('aria-hidden','false');
  luDrawer.scrollTop = 0;
  document.getElementById('lu-close').focus();
  luDrawer.addEventListener('keydown', luDrawerTrap);
}
function luCloseDrawer(){
  luDrawer.classList.remove('open'); luScrim.classList.remove('open');
  luDrawer.setAttribute('aria-hidden','true');
  luDrawer.removeEventListener('keydown', luDrawerTrap);
  if(luDrawerReturnFocus && document.contains(luDrawerReturnFocus)) luDrawerReturnFocus.focus();
  luDrawerReturnFocus = null;
}
luScrim.addEventListener('click', luCloseDrawer);
document.getElementById('lu-close').addEventListener('click', luCloseDrawer);

function luStatusClass(code){ return (code||'na').toLowerCase(); }

function luFindEcho(species){
  const fam = luState.echo && luState.echo.families[species.family];
  if(!fam) return null;
  const sciSpace = luNiceName(species.sciName);
  const genusExample = fam.genusExamples && (fam.genusExamples[sciSpace] || fam.genusExamples[species.genus]);
  return { base: fam, override: genusExample || null };
}

function luSpeciesHTML(binomial, compact){
  const s = luState.byName[binomial.toLowerCase()];
  if(!s){
    return '<p class="lu-d-sci">'+luEsc(binomial)+'</p>'+
      '<p class="lu-prov">'+(luState.ready
        ? 'No record under this name in the Mammal Diversity Database export — most likely a spelling variant of a name the database files differently.'
        : 'The species records have not loaded yet. This page needs to be served over http for them to load.')+'</p>';
  }
  return luDetailHTML(s, compact);
}

function loadLocalPhoto(asset, host){
  if(!host || !asset || asset.status !== 'available') return;
  host.removeAttribute('aria-busy');
  const source = asset.sourceUrl ? '<a href="'+luEsc(asset.sourceUrl)+'" target="_blank" rel="noopener noreferrer">' : '';
  const close = asset.sourceUrl ? '</a>' : '';
  host.innerHTML = source+
    '<img src="'+luEsc(asset.path)+'" alt="'+luEsc(asset.alt||'Species photograph')+'" loading="eager" fetchpriority="high" decoding="async">'+
    '<figcaption>'+luEsc(asset.attribution)+' · '+luEsc(asset.license)+' · iNaturalist</figcaption>'+close;
  host.querySelector('img').addEventListener('error', ()=>host.remove(), {once:true});
}

function luDetailHTML(s, compact){
  const echo = luFindEcho(s);
  const merged = echo ? Object.assign({}, echo.base, echo.override||{}) : null;
  const dk = luState.danish[s.sciName];
  const bin = luNiceName(s.sciName);
  const media = luState.media[s.id];

  // the full rank ladder, shown as one breadcrumb above the name
  const lineage = ['order','suborder','infraorder','superfamily','family','subfamily','tribe','genus']
    .filter(k=>s[k] && s[k]!=='NA')
    .map(k=>luEsc(s[k])).join(' &rsaquo; ');

  const callRows = [];
  if(ESP[bin]) callRows.push('<dt>Species call</dt><dd>'+luEsc(ESP[bin])+'</dd>');
  if(merged){
    callRows.push('<dt>Call type</dt><dd>'+luEsc(merged.callType||'—')+'</dd>');
    callRows.push('<dt>Duty cycle</dt><dd>'+luEsc(merged.dutyCycle||'—')+'</dd>');
    callRows.push('<dt>Reference range</dt><dd>'+(merged.peakFrequencyKHz ? luEsc(merged.peakFrequencyKHz.join('–'))+' kHz' : '—')+'</dd>');
  }
  const callSection = '<section class="lu-section"><h4>Call</h4>'+
    (callRows.length ? '<dl>'+callRows.join('')+'</dl>' : '<p class="lu-note">No reference data for '+luEsc(s.family)+'.</p>')+
    (merged && merged.foragingNote ? '<p class="lu-note">'+luEsc(merged.foragingNote)+'</p>' : '')+
    (merged ? '<p class="lu-src">'+(echo.override ? 'Genus reference' : 'Family reference')+'. Not verified per species.</p>' : '')+
    '</section>';

  const links = LINKS.map(([label,url,icon])=>
    '<a href="'+url(bin)+'" target="_blank" rel="noopener noreferrer" aria-label="'+luEsc(label)+'" title="'+luEsc(label)+'">'+icon+'</a>').join('');

  return (media && media.status === 'available' ? '<figure class="inat-photo" aria-busy="true"></figure>' : '')+
    '<p class="card-lineage">'+lineage+'</p>'+
    '<p class="lu-d-sci">'+luEsc(bin)+'</p>'+
    (s.mainCommonName ? '<p class="lu-d-common">'+luEsc(s.mainCommonName)+(s.otherCommonNames ? ' · '+luEsc(s.otherCommonNames) : '')+'</p>' : '')+
    (dk ? '<p class="lu-d-common lu-dk">🇩🇰 '+luEsc(dk.allNames.join(' / '))+' <span class="lu-dk-src">('+luEsc(dk.source)+')</span></p>' : '')+
    '<p class="lu-d-authority">'+luEsc((s.authoritySpeciesAuthor||'')+' '+(s.authoritySpeciesYear||''))+'</p>'+
    '<div class="lu-links">'+links+'</div>'+
    '<div class="lu-facts">'+
      '<section class="lu-section"><h4>Taxonomy &amp; status</h4><dl>'+
        '<dt>IUCN status</dt><dd><span class="lu-status '+luStatusClass(s.iucnStatus)+'">'+(s.iucnStatus||'NA')+'</span></dd>'+
        '<dt>Extinct</dt><dd>'+(s.extinct==='1' ? 'Yes' : 'No')+'</dd>'+
        '<dt>Realm</dt><dd>'+luEsc(s.biogeographicRealm||'—')+'</dd>'+
        '<dt>Continents</dt><dd>'+luEsc((s.continentDistribution||'—').replace(/\|/g,', '))+'</dd>'+
        '<dt>Countries</dt><dd>'+luEsc((s.countryDistribution||'—').replace(/\|/g,', '))+'</dd>'+
      '</dl></section>'+
      callSection+
    '</div>'+
    '<p class="lu-prov">Sources: <a href="https://doi.org/10.5281/zenodo.21654811" target="_blank" rel="noopener">MDD v2.5</a>'+
    (dk ? ' · <a href="https://www.gbif.org" target="_blank" rel="noopener">GBIF</a>' : '')+'</p>';
}

function luSelectSpecies(id, focusCard = false){
  luState.active = id;
  luCloseResults();
  const s = luState.species.find(x=>x.id===id);
  if(!s) return;
  const binomial = luNiceName(s.sciName);
  const opened = openTreeToSpecies(s.family, s.genus, binomial, focusCard);
  if(!opened){
    // fallback for anything not represented in the cladogram
    luDetail.innerHTML = luDetailHTML(s, false);
    loadLocalPhoto(luState.media[s.id], luDetail.querySelector('.inat-photo'));
    luOpenDrawer();
  }
}

/* =========================================================
   10. START THE TREE
   ========================================================= */
const treeToggle = document.getElementById('t-toggle');
function positionTreeTools(){
  const tools = document.querySelector('.tree-tools');
  const box = document.querySelector('.treebox');
  const heading = svg.querySelector('.sub-label');
  const scale = svg.clientWidth / VW;
  if(!tools || !box || !heading || !scale) return;
  const boxRect = box.getBoundingClientRect();
  const headingRect = heading.getBoundingClientRect();
  tools.style.top = Math.max(4, headingRect.top-boxRect.top+(headingRect.height-tools.offsetHeight)/2)+'px';
  tools.style.right = Math.max(8, 24*scale)+'px';
}
function allFamiliesOpen(){
  return BLOCKS.every(b=>b.members.every(f=>mainCtx.open.has('f:'+f)));
}
function updateTreeToggle(){
  const expanded = allFamiliesOpen();
  const label = expanded ? 'Collapse all branches' : 'Expand all branches';
  treeToggle.setAttribute('aria-label', label);
  treeToggle.title = label;
  treeToggle.querySelector('path').setAttribute('d', expanded
    ? 'M6 3l6 6 6-6M6 21l6-6 6 6'
    : 'M6 9l6-6 6 6M6 15l6 6 6-6');
  treeToggle.setAttribute('aria-pressed', expanded ? 'true' : 'false');
}

mainCtx = makeTreeCtx({
  svg, card: document.getElementById('card'),
  tree: TREE, blocks: BLOCKS, famInfo: F,
  famChildren, nodeChildren: n => n.kind==='genus' ? genusChildren(n.name) : (n.children||null),
  emptyHTML: '',
  onDrawn: ()=>{ applyTreeDim(); updateTreeToggle(); positionTreeTools(); }
});

addEventListener('resize', positionTreeTools, {passive:true});
if(document.fonts) document.fonts.ready.then(positionTreeTools);

ctxCardReset(mainCtx);
ctxDrawTree(mainCtx);

mainCtx.card.addEventListener('click', e=>{
  const btn = e.target.closest('.jump');
  if(btn){ ctxToggleFamily(mainCtx, btn.dataset.fam); return; }
});

treeToggle.addEventListener('click', ()=>{
  const expanded = allFamiliesOpen();
  BLOCKS.forEach(b=>b.members.forEach(f=>{
    expanded ? mainCtx.open.delete('f:'+f) : mainCtx.open.add('f:'+f);
  }));
  if(expanded) ctxCardReset(mainCtx);
  ctxDrawTree(mainCtx);
  if(expanded) document.querySelector('.treebox').scrollIntoView({block:'nearest'});
});
</script>
